name: Virtual accounts one-shot wiring

on:
  push:
    branches:
      - feat/economy-virtual-accounts
    paths:
      - .github/workflows/virtual-accounts-transform.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/economy-virtual-accounts
          fetch-depth: 0
      - name: Apply scoped wiring
        run: python3 scripts/apply_virtual_accounts_stage.py
      - name: Validate patch whitespace
        run: git diff --check
      - name: Commit target files and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- prisma/schema.prisma src/dashboard/routes/v2.ts dashboard-ui/src/pages/ServerSlot.tsx src/commands/inventory.ts
          git rm -- scripts/apply_virtual_accounts_stage.py .github/workflows/virtual-accounts-transform.yml
          git commit -m "Wire virtual accounts into economy surfaces"
          git push origin HEAD:feat/economy-virtual-accounts

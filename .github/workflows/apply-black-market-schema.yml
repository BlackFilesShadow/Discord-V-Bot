name: Apply black market schema wiring

on:
  push:
    branches: [feat/economy-black-market]
    paths: [.github/workflows/apply-black-market-schema.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/economy-black-market
          fetch-depth: 0
      - run: python3 scripts/apply_black_market_schema.py
      - run: git diff --check
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- prisma/schema.prisma src/dashboard/routes/v2.ts
          git rm -f --ignore-unmatch -- scripts/apply_black_market_schema.py .github/workflows/apply-black-market-schema.yml
          git commit -m "Wire black market schema and dashboard route"
          git push origin HEAD:feat/economy-black-market

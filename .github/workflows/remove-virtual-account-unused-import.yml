name: Virtual accounts one-shot import cleanup

on:
  push:
    branches:
      - feat/economy-virtual-accounts
    paths:
      - .github/workflows/remove-virtual-account-unused-import.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/economy-virtual-accounts
          fetch-depth: 0
      - name: Remove unused import
        run: python3 scripts/remove_virtual_account_unused_import.py
      - name: Validate patch whitespace
        run: git diff --check
      - name: Commit cleanup and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/dashboard/routes/v2/economyVirtualAccounts.ts
          git rm -- scripts/remove_virtual_account_unused_import.py .github/workflows/remove-virtual-account-unused-import.yml
          git commit -m "Remove unused virtual account route import"
          git push origin HEAD:feat/economy-virtual-accounts

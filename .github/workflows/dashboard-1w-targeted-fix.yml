name: Dashboard-1W Targeted Source Fix

on:
  push:
    branches: [fix/dashboard-1w-audit-contract]
    paths: [.github/workflows/dashboard-1w-targeted-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/dashboard-1w-audit-log-contract
          fetch-depth: 0
      - name: Patch audit UI and append-only audit redaction
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin fix/dashboard-1w-audit-log-contract
          python3 <<'PY'
          from pathlib import Path
          import re

          logger_path = Path('src/utils/logger.ts')
          logger = logger_path.read_text()
          replacement = '''function redactSecrets(input: Record<string, unknown>): Record<string, unknown> {
  const out: Record<string, unknown> = {};
  for (const [k, v] of Object.entries(input)) {
    if (SECRET_KEY_RE.test(k)) {
      out[k] = '[REDACTED]';
    } else {
      // Share the recursive/free-text policy used by DB persistence and reads.
      out[k] = redactAuditDetails(v, k);
    }
  }
  return out;
}

'''
          pattern = r"function redactSecrets\(input: Record<string, unknown>\): Record<string, unknown> \{.*?\n\}\n\n(?=export function logAudit)"
          logger, count = re.subn(pattern, replacement, logger, count=1, flags=re.S)
          if count != 1:
            raise SystemExit(f'logger replacement count={count}')
          logger_path.write_text(logger)

          server_path = Path('dashboard-ui/src/pages/Server.tsx')
          server = server_path.read_text()
          old_button = '<Button type="submit" disabled={list.isFetching && !list.isFetchingNextPage}>Suchen</Button>'
          new_button = '<Button type="submit" disabled={list.isFetching}>Suchen</Button>'
          if old_button in server:
            server = server.replace(old_button, new_button, 1)
          elif new_button not in server:
            raise SystemExit('Audit search button anchor missing')

          old_error = '''      {list.isError && (
        <Card>
          <p className="text-danger text-sm">Fehler: {(list.error as ApiError).message}</p>
        </Card>
      )}
'''
          new_error = '''      {list.isError && !list.isFetchNextPageError && (
        <Card>
          <p className="text-danger text-sm">Fehler: {(list.error as ApiError).message}</p>
        </Card>
      )}
      {list.isFetchNextPageError && (
        <Card>
          <p className="text-danger text-sm">Fehler beim Nachladen: {(list.error as ApiError).message}</p>
        </Card>
      )}
'''
          if old_error in server:
            server = server.replace(old_error, new_error, 1)
          elif 'Fehler beim Nachladen:' not in server:
            raise SystemExit('Audit list error anchor missing')
          server_path.write_text(server)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/logger.ts dashboard-ui/src/pages/Server.tsx
          git diff --cached --check
          git commit -m "Dashboard-1W: fix pagination error state and audit file redaction"
          git push origin HEAD:fix/dashboard-1w-audit-log-contract

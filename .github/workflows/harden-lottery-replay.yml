name: Lottery replay hardening

on:
  push:
    branches: [feat/economy-lottery]
    paths:
      - '.github/workflows/harden-lottery-replay.yml'
      - 'scripts/harden_lottery_replay.py'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/economy-lottery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply hardening
        run: python scripts/harden_lottery_replay.py
      - name: Commit exact hardening scope
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/modules/economy/lottery.ts tests/security/economyLotterySafety.test.ts
          if git diff --cached --quiet; then
            echo 'No hardening changes required.'
            exit 0
          fi
          git commit -m 'Harden lottery replay refund and scheduler races'
          git push origin HEAD:feat/economy-lottery

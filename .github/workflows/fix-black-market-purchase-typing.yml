name: Fix black market purchase typing
on:
  push:
    branches: [feat/economy-black-market]
    paths: [.github/workflows/fix-black-market-purchase-typing.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/economy-black-market
          fetch-depth: 0
      - run: python3 scripts/fix_black_market_purchase_typing.py
      - run: git diff --check
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/modules/economy/blackMarket.ts
          git rm -f --ignore-unmatch -- scripts/fix_black_market_purchase_typing.py .github/workflows/fix-black-market-purchase-typing.yml
          git commit -m "Fix black market purchase source pocket typing"
          git push origin HEAD:feat/economy-black-market

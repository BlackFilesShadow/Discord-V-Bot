name: Lottery one-shot race hardening

on:
  push:
    branches: [feat/economy-lottery]
    paths: [.github/workflows/harden-lottery-races.yml]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/economy-lottery
          fetch-depth: 0
      - run: python3 scripts/harden_lottery_races.py
      - run: git diff --check
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/modules/economy/lottery.ts
          git rm -- scripts/harden_lottery_races.py .github/workflows/harden-lottery-races.yml
          git commit -m "Harden lottery retries and settlement isolation"
          git push origin HEAD:feat/economy-lottery

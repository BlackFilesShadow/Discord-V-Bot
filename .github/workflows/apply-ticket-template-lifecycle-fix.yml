name: Apply ticket template lifecycle fix

on:
  push:
    branches:
      - fix/ticket-transcript-archive-images

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ticket-transcript-archive-images
          fetch-depth: 0

      - name: Apply lifecycle preservation patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          # 1) Prisma schema: archived TicketInstance survives template hard-delete.
          schema_path = Path('prisma/schema.prisma')
          schema = schema_path.read_text()
          schema = replace_once(
              schema,
              '''  templateNumber      Int?\n  templateId          String\n  template            TicketTemplate @relation(fields: [templateId], references: [id], onDelete: Cascade)\n  guildId             String''',
              '''  templateNumber         Int?\n  templateId             String?\n  template               TicketTemplate? @relation(fields: [templateId], references: [id], onDelete: SetNull)\n  templateLabelSnapshot  String\n  templateSlotSnapshot   Int\n  guildId                String''',
              'schema ticket template relation',
          )
          schema_path.write_text(schema)

          # 2) Ticket open/close runtime: snapshot template identity + fence stale open-button races.
          ticket_path = Path('src/modules/tickets/ticketSystem.ts')
          text = ticket_path.read_text()

          text = replace_once(
              text,
              '''      const updated = await tx.ticketTemplate.update({\n        where: { id: t.id },\n        data: { ticketCounter: { increment: 1 } },\n        select: { ticketCounter: true },\n      });\n      const inst = await tx.ticketInstance.create({''',
              '''      // Delete-Fence: ein Button kann kurz vor einer Template-Loeschung geklickt\n      // worden sein. Nur ein weiterhin aktives Template darf den Counter erhoehen\n      // und eine neue Instance erzeugen. Sobald DELETE isActive=false gesetzt hat,\n      // scheitert dieser stale Open-Vorgang atomar.\n      const claimed = await tx.ticketTemplate.updateMany({\n        where: { id: t.id, isActive: true },\n        data: { ticketCounter: { increment: 1 } },\n      });\n      if (claimed.count !== 1) throw new Error('TICKET_TEMPLATE_INACTIVE');\n      const updated = await tx.ticketTemplate.findUniqueOrThrow({\n        where: { id: t.id },\n        select: { ticketCounter: true },\n      });\n      const inst = await tx.ticketInstance.create({''',
              'ticket open delete fence',
          )

          text = replace_once(
              text,
              '''          templateId: t.id,\n          guildId: guild.id,\n          channelId: `pending:${btn.id}`,''',
              '''          templateId: t.id,\n          templateLabelSnapshot: t.label,\n          templateSlotSnapshot: t.slot,\n          guildId: guild.id,\n          channelId: `pending:${btn.id}`,''',
              'ticket instance template snapshot',
          )

          text = replace_once(
              text,
              '''      const inst = instance as unknown as { templateNumber?: number | null; templateId: string };\n      const tn = inst.templateNumber;\n      await prisma.ticketInstance.delete({ where: { id: instance.id } }).catch(() => {});\n      if (typeof tn === 'number' && tn > 0) {\n        await prisma.ticketTemplate.updateMany({\n          where: { id: inst.templateId, ticketCounter: tn },''',
              '''      const inst = instance as unknown as { templateNumber?: number | null; templateId: string | null };\n      const tn = inst.templateNumber;\n      await prisma.ticketInstance.delete({ where: { id: instance.id } }).catch(() => {});\n      if (inst.templateId && typeof tn === 'number' && tn > 0) {\n        await prisma.ticketTemplate.updateMany({\n          where: { id: inst.templateId, ticketCounter: tn },''',
              'ticket open cleanup nullable template',
          )

          text = replace_once(
              text,
              '''  if (!instance || instance.status !== 'OPEN') {\n    await btn.reply({ content: 'Ticket bereits geschlossen.', flags: MessageFlags.Ephemeral });\n    return;\n  }''',
              '''  if (!instance || instance.status !== 'OPEN') {\n    await btn.reply({ content: 'Ticket bereits geschlossen.', flags: MessageFlags.Ephemeral });\n    return;\n  }\n  // OPEN-Tickets duerfen niemals ohne Template existieren. Ein null-Template ist\n  // nur fuer bereits CLOSED/archivierte Instanzen nach Template-Loeschung erlaubt.\n  if (!instance.template) {\n    logger.error(`Offenes Ticket ${instance.id} hat kein Template mehr — Close abgebrochen.`);\n    await btn.reply({ content: 'Ticket-Konfiguration fehlt. Bitte Admin informieren.', flags: MessageFlags.Ephemeral });\n    return;\n  }''',
              'close guard orphan open ticket',
          )

          text = replace_once(
              text,
              '''    await btn.editReply({ content: 'Konnte Ticket nicht erstellen. Bitte Admin informieren.' }).catch(() => {});\n  }\n}''',
              '''    const unavailable = (e as Error).message === 'TICKET_TEMPLATE_INACTIVE';\n    await btn.editReply({\n      content: unavailable\n        ? 'Template ist nicht mehr verfuegbar.'\n        : 'Konnte Ticket nicht erstellen. Bitte Admin informieren.',\n    }).catch(() => {});\n  }\n}''',
              'stale open user response',
          )

          ticket_path.write_text(text)

          # 3) Dashboard API: archived rows render snapshots; delete is fail-closed + race fenced.
          route_path = Path('src/dashboard/routes/v2/tickets.ts')
          route = route_path.read_text()
          route = route.replace(' * DELETE /:id              -> Loeschen (Cascade auf Instances)',
                                ' * DELETE /:id              -> Template loeschen; archivierte Instances bleiben erhalten')

          route = replace_once(
              route,
              '''      templateLabel: i.template.label,\n      templateSlot: i.template.slot,''',
              '''      templateLabel: i.template?.label ?? i.templateLabelSnapshot,\n      templateSlot: i.template?.slot ?? i.templateSlotSnapshot,''',
              'ticket instance snapshot serialization',
          )

          old_delete = '''  // F4: Vor Cascade alle offenen Discord-Channels schliessen + Embed entfernen.\n  const client = tryGetDashboardClient();\n  let purged: { closed: number; failed: number } = { closed: 0, failed: 0 };\n  if (client) {\n    purged = await purgeTemplateInstances(client, id).catch(() => ({ closed: 0, failed: 0 }));\n    if (existing.postedMessageId) {\n      await unpostTemplateEmbed(client, id).catch(() => {});\n    }\n  }\n\n  await prisma.ticketTemplate.delete({ where: { id } });\n  logAuditDb('TICKET_TEMPLATE_DELETED', 'TICKET', { actorUserId: req.auth!.userId, guildId: scope.guildId, details: { templateId: id, slot: existing.slot, label: existing.label, purged } });'''
          new_delete = '''  // Lifecycle-Fence: zuerst deaktivieren. Dadurch lehnt auch ein bereits\n  // ausgelieferter/staler Open-Button den atomaren Counter-Claim ab.\n  const wasActive = existing.isActive;\n  await prisma.ticketTemplate.update({ where: { id }, data: { isActive: false } });\n\n  const restoreTemplate = async (): Promise<void> => {\n    if (wasActive) {\n      await prisma.ticketTemplate.updateMany({ where: { id }, data: { isActive: true } }).catch(() => {});\n    }\n  };\n\n  const openBefore = await prisma.ticketInstance.count({ where: { templateId: id, status: 'OPEN' } });\n  const client = tryGetDashboardClient();\n  let purged: { closed: number; failed: number } = { closed: 0, failed: 0 };\n\n  if (openBefore > 0 && !client) {\n    await restoreTemplate();\n    res.status(503).json({ error: 'Template wurde nicht geloescht: Offene Tickets muessen zuerst vollstaendig archiviert werden, aber der Bot ist nicht bereit.' });\n    return;\n  }\n\n  if (client && openBefore > 0) {\n    purged = await purgeTemplateInstances(client, id).catch(err => {\n      logger.error('TicketTemplate purge vor Delete fehlgeschlagen:', err as Error);\n      return { closed: 0, failed: openBefore };\n    });\n    if (purged.failed > 0) {\n      await restoreTemplate();\n      logAuditDb('TICKET_TEMPLATE_DELETE_BLOCKED', 'TICKET', {\n        actorUserId: req.auth!.userId, guildId: scope.guildId,\n        details: { templateId: id, reason: 'archive_failed', purged },\n      });\n      res.status(409).json({\n        error: 'Template wurde nicht geloescht: Mindestens ein offenes Ticket konnte nicht vollstaendig inklusive Bilder/Anhaenge archiviert werden.',\n        purged,\n      });\n      return;\n    }\n  }\n\n  // Nach dem Purge erneut pruefen. Durch isActive=false + Open-Transaction-Fence\n  // kann ab hier keine neue Instance mehr entstehen.\n  const remainingOpen = await prisma.ticketInstance.count({ where: { templateId: id, status: 'OPEN' } });\n  if (remainingOpen > 0) {\n    await restoreTemplate();\n    logAuditDb('TICKET_TEMPLATE_DELETE_BLOCKED', 'TICKET', {\n      actorUserId: req.auth!.userId, guildId: scope.guildId,\n      details: { templateId: id, reason: 'open_instances_remain', remainingOpen, purged },\n    });\n    res.status(409).json({ error: `Template wurde nicht geloescht: ${remainingOpen} offene Tickets sind noch vorhanden.` });\n    return;\n  }\n\n  if (client && existing.postedMessageId) {\n    await unpostTemplateEmbed(client, id).catch(() => {});\n  }\n\n  // DB-FK ist SET NULL: CLOSED TicketInstance-Zeilen, Transcript-HTML und\n  // archivierte Bildbytes bleiben erhalten. Label/Slot kommen danach aus Snapshots.\n  await prisma.ticketTemplate.delete({ where: { id } });\n  logAuditDb('TICKET_TEMPLATE_DELETED', 'TICKET', { actorUserId: req.auth!.userId, guildId: scope.guildId, details: { templateId: id, slot: existing.slot, label: existing.label, purged, preservedArchives: true } });'''
          route = replace_once(route, old_delete, new_delete, 'ticket template delete lifecycle')
          route_path.write_text(route)

          # 4) SQL migration: backfill snapshots, make templateId nullable, replace composite CASCADE with SET NULL(templateId).
          migration_dir = Path('prisma/migrations/20260825010500_ticket_template_archive_preserve')
          migration_dir.mkdir(parents=True, exist_ok=True)
          (migration_dir / 'migration.sql').write_text('''-- Preserve archived ticket instances when a TicketTemplate is deleted.\n-- Closed ticket transcripts are historical records and must never cascade away.\n\nALTER TABLE "TicketInstance"\n  ADD COLUMN "templateLabelSnapshot" TEXT,\n  ADD COLUMN "templateSlotSnapshot" INTEGER;\n\nUPDATE "TicketInstance" AS i\nSET "templateLabelSnapshot" = t."label",\n    "templateSlotSnapshot" = t."slot"\nFROM "TicketTemplate" AS t\nWHERE i."templateId" = t."id";\n\nDO $$\nBEGIN\n  IF EXISTS (\n    SELECT 1 FROM "TicketInstance"\n    WHERE "templateLabelSnapshot" IS NULL OR "templateSlotSnapshot" IS NULL\n  ) THEN\n    RAISE EXCEPTION 'ticket archive migration aborted: template snapshot backfill incomplete';\n  END IF;\nEND $$;\n\nALTER TABLE "TicketInstance"\n  ALTER COLUMN "templateLabelSnapshot" SET NOT NULL,\n  ALTER COLUMN "templateSlotSnapshot" SET NOT NULL,\n  ALTER COLUMN "templateId" DROP NOT NULL;\n\nALTER TABLE "TicketInstance" DROP CONSTRAINT IF EXISTS "TicketInstance_templateId_fkey";\nALTER TABLE "TicketInstance" DROP CONSTRAINT IF EXISTS "TicketInstance_template_guild_fkey";\n\n-- Keep guildId intact when the parent disappears; only templateId is nulled.\nALTER TABLE "TicketInstance" ADD CONSTRAINT "TicketInstance_template_guild_fkey"\n  FOREIGN KEY ("templateId", "guildId")\n  REFERENCES "TicketTemplate"("id", "guildId")\n  ON DELETE SET NULL ("templateId")\n  ON UPDATE CASCADE;\n''')

          # 5) Regression architecture test: schema/migration/runtime contracts stay locked.
          test_path = Path('tests/modules/ticketTemplateArchiveLifecycle.test.ts')
          test_path.write_text('''import fs from 'node:fs';\nimport path from 'node:path';\n\ndescribe('ticket template archive lifecycle', () => {\n  const root = process.cwd();\n  const schema = fs.readFileSync(path.join(root, 'prisma/schema.prisma'), 'utf8');\n  const migration = fs.readFileSync(\n    path.join(root, 'prisma/migrations/20260825010500_ticket_template_archive_preserve/migration.sql'),\n    'utf8',\n  );\n  const ticketSystem = fs.readFileSync(path.join(root, 'src/modules/tickets/ticketSystem.ts'), 'utf8');\n  const route = fs.readFileSync(path.join(root, 'src/dashboard/routes/v2/tickets.ts'), 'utf8');\n\n  it('keeps archived TicketInstance rows when a template is deleted', () => {\n    expect(schema).toContain('templateId             String?');\n    expect(schema).toContain('TicketTemplate? @relation(fields: [templateId], references: [id], onDelete: SetNull)');\n    expect(schema).toContain('templateLabelSnapshot  String');\n    expect(schema).toContain('templateSlotSnapshot   Int');\n    expect(migration).toContain('ON DELETE SET NULL ("templateId")');\n    expect(migration).not.toContain('ON DELETE CASCADE ON UPDATE CASCADE;');\n  });\n\n  it('snapshots template identity when opening a ticket', () => {\n    expect(ticketSystem).toContain('templateLabelSnapshot: t.label');\n    expect(ticketSystem).toContain('templateSlotSnapshot: t.slot');\n  });\n\n  it('fences stale open buttons while a template is being deleted', () => {\n    expect(ticketSystem).toContain("where: { id: t.id, isActive: true }");\n    expect(ticketSystem).toContain("throw new Error('TICKET_TEMPLATE_INACTIVE')");\n    expect(route).toContain("data: { isActive: false }");\n    expect(route).toContain("status: 'OPEN'");\n  });\n\n  it('blocks template deletion when ticket archival is incomplete', () => {\n    expect(route).toContain('purged.failed > 0');\n    expect(route).toContain('remainingOpen > 0');\n    expect(route).toContain('preservedArchives: true');\n  });\n\n  it('renders deleted-template ticket rows from immutable snapshots', () => {\n    expect(route).toContain('i.template?.label ?? i.templateLabelSnapshot');\n    expect(route).toContain('i.template?.slot ?? i.templateSlotSnapshot');\n  });\n});\n''')
          PY

      - name: Verify patch shape
        shell: bash
        run: |
          grep -q 'onDelete: SetNull' prisma/schema.prisma
          grep -q 'ON DELETE SET NULL ("templateId")' prisma/migrations/20260825010500_ticket_template_archive_preserve/migration.sql
          grep -q 'templateLabelSnapshot: t.label' src/modules/tickets/ticketSystem.ts
          grep -q 'purged.failed > 0' src/dashboard/routes/v2/tickets.ts
          git diff --check

      - name: Commit source patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-ticket-template-lifecycle-fix.yml
          git add prisma/schema.prisma \
            prisma/migrations/20260825010500_ticket_template_archive_preserve/migration.sql \
            src/modules/tickets/ticketSystem.ts \
            src/dashboard/routes/v2/tickets.ts \
            tests/modules/ticketTemplateArchiveLifecycle.test.ts
          git commit -m "fix(tickets): preserve archives when templates are deleted"
          git push origin HEAD:fix/ticket-transcript-archive-images

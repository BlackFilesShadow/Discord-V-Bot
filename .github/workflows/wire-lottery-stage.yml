name: Lottery one-shot wiring

on:
  push:
    branches: [feat/economy-lottery]
    paths:
      - '.github/workflows/wire-lottery-stage.yml'
      - 'scripts/wire_lottery_stage.py'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/economy-lottery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply wiring
        run: python scripts/wire_lottery_stage.py
      - name: Commit exact wiring scope
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- prisma/schema.prisma src/dashboard/routes/v2.ts dashboard-ui/src/pages/ServerSlot.tsx src/commands/inventory.ts src/events/interactionCreate.ts src/index.ts
          if git diff --cached --quiet; then
            echo 'No wiring changes required.'
            exit 0
          fi
          git commit -m 'Wire lottery into runtime dashboard and Prisma'
          git push origin HEAD:feat/economy-lottery

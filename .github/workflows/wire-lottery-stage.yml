name: Lottery one-shot wiring

on:
  push:
    branches: [feat/economy-lottery]
    paths: [.github/workflows/wire-lottery-stage.yml]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/economy-lottery
          fetch-depth: 0
      - run: python3 scripts/wire_lottery_stage.py
      - run: git diff --check
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- prisma/schema.prisma src/dashboard/routes/v2.ts dashboard-ui/src/pages/ServerSlot.tsx src/commands/inventory.ts src/events/interactionCreate.ts src/index.ts
          git rm -- scripts/wire_lottery_stage.py .github/workflows/wire-lottery-stage.yml
          git commit -m "Wire lottery into runtime and dashboard surfaces"
          git push origin HEAD:feat/economy-lottery

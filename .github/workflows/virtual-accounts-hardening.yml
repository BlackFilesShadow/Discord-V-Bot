name: Virtual accounts one-shot hardening

on:
  push:
    branches:
      - feat/economy-virtual-accounts
    paths:
      - .github/workflows/virtual-accounts-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/economy-virtual-accounts
          fetch-depth: 0
      - name: Apply hardening
        run: python3 scripts/harden_virtual_accounts_stage.py
      - name: Validate patch whitespace
        run: git diff --check
      - name: Commit hardened files and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/modules/economy/virtualAccounts.ts src/dashboard/routes/v2/economyVirtualAccounts.ts tests/modules/economyVirtualAccounts.test.ts tests/security/economyVirtualAccountsSafety.test.ts
          git rm -- scripts/harden_virtual_accounts_stage.py .github/workflows/virtual-accounts-hardening.yml
          git commit -m "Harden virtual account scope and payout validation"
          git push origin HEAD:feat/economy-virtual-accounts

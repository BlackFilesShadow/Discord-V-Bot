name: Final dependency hardening
on:
  push:
    branches: [hardening/final-security-transaction-review]
    paths: [.github/workflows/final-dependency-hardening.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/final-security-transaction-review
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard-ui/package-lock.json
      - run: python3 scripts/final_dependency_hardening.py
      - run: npm install --package-lock-only
      - run: npm install --package-lock-only
        working-directory: dashboard-ui
      - name: Backend production high audit
        run: npm audit --omit=dev --audit-level=high
      - name: Dashboard production high audit
        working-directory: dashboard-ui
        run: npm audit --omit=dev --audit-level=high
      - run: git diff --check
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json dashboard-ui/package.json dashboard-ui/package-lock.json .github/workflows/ci.yml
          git rm -f --ignore-unmatch -- scripts/final_dependency_hardening.py .github/workflows/final-dependency-hardening.yml
          git commit -m "Harden production dependencies and audit gates"
          git push origin HEAD:hardening/final-security-transaction-review

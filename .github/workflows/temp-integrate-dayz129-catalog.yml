name: TEMP Integrate Complete DayZ Catalog

on:
  push:
    branches: [feat/dayz129-complete-grounded-catalog]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/dayz129-complete-grounded-catalog
          fetch-depth: 0
      - name: Integrate catalog into AI paths
        run: python3 .github/scripts/temp_integrate_dayz129_catalog.py
      - name: Remove temporary patch/generator workflows and commit
        run: |
          git rm -f .github/scripts/temp_integrate_dayz129_catalog.py .github/workflows/temp-integrate-dayz129-catalog.yml .github/workflows/temp-generate-dayz129-index.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/ai/aiHandler.ts src/modules/ai/nitradoHelp.ts src/modules/ai/dayz129Catalog.ts src/events/messageCreate.ts scripts/generate_dayz129_index.py tests/ai/dayz129Catalog.test.ts
          git commit -m "Integrate complete grounded DayZ 1.29 catalog"
          git push origin HEAD:feat/dayz129-complete-grounded-catalog

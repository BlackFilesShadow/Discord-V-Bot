name: Apply ticket nullable-template type fix

on:
  push:
    branches:
      - fix/ticket-transcript-archive-images

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ticket-transcript-archive-images
          fetch-depth: 0

      - name: Apply narrow TypeScript fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/modules/tickets/ticketSystem.ts')
          s = p.read_text()

          old = '''type TicketWithTemplate = Awaited<ReturnType<typeof prisma.ticketInstance.findUnique>> & {\n  template: { staffRoleId: string | null; managerRoleIds?: unknown };\n};'''
          new = '''type TicketWithTemplate = Awaited<ReturnType<typeof prisma.ticketInstance.findUnique>> & {\n  template: { staffRoleId: string | null; managerRoleIds?: unknown } | null;\n};'''
          if s.count(old) != 1:
              raise SystemExit(f'TicketWithTemplate anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''  if (member.permissions && member.permissions.has(PermissionFlagsBits.Administrator)) return true;\n  if (instance.template.staffRoleId && member.roles.cache.has(instance.template.staffRoleId)) return true;'''
          new = '''  if (member.permissions && member.permissions.has(PermissionFlagsBits.Administrator)) return true;\n  // Nach einer Template-Loeschung bleibt das CLOSED Ticket als Archiv bestehen.\n  // Ohne Template sind historische Staff-/Manager-Rollen nicht mehr belastbar;\n  // Owner/Admin duerfen das Archiv weiterhin verwalten, andere werden abgewiesen.\n  if (!instance.template) return false;\n  if (instance.template.staffRoleId && member.roles.cache.has(instance.template.staffRoleId)) return true;'''
          if s.count(old) != 1:
              raise SystemExit(f'permission null guard anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''  if (tmId) {\n    try {\n      const ch = await modal.client.channels.fetch(inst.template.transcriptChannelId).catch(() => null);'''
          new = '''  if (tmId && inst.template) {\n    try {\n      const ch = await modal.client.channels.fetch(inst.template.transcriptChannelId).catch(() => null);'''
          if s.count(old) != 1:
              raise SystemExit(f'reason inst template guard anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''          if (fresh) {\n            const fAny = fresh as unknown as {'''
          new = '''          if (fresh?.template) {\n            const fAny = fresh as unknown as {'''
          if s.count(old) != 1:
              raise SystemExit(f'fresh template guard anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Verify focused fix
        shell: bash
        run: |
          grep -q 'managerRoleIds?: unknown } | null' src/modules/tickets/ticketSystem.ts
          grep -q 'if (!instance.template) return false;' src/modules/tickets/ticketSystem.ts
          grep -q 'if (tmId && inst.template)' src/modules/tickets/ticketSystem.ts
          grep -q 'if (fresh?.template)' src/modules/tickets/ticketSystem.ts
          git diff --check

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-ticket-nullability-fix.yml
          git add src/modules/tickets/ticketSystem.ts
          git commit -m "fix(tickets): handle deleted template relation safely"
          git push origin HEAD:fix/ticket-transcript-archive-images

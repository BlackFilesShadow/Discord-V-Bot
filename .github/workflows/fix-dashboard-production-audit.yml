name: Fix dashboard production audit

on:
  push:
    branches: [hardening/final-security-transaction-review]
    paths: [.github/workflows/fix-dashboard-production-audit.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hardening/final-security-transaction-review
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard-ui/package-lock.json
      - name: Install dashboard dependencies
        working-directory: dashboard-ui
        run: npm ci
      - name: Apply safe production audit fix without force
        working-directory: dashboard-ui
        run: npm audit fix --omit=dev
      - name: Verify production audit has no vulnerabilities
        working-directory: dashboard-ui
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --json > /tmp/dashboard-audit.json || true
          node -e "const a=require('/tmp/dashboard-audit.json'); const v=a.metadata?.vulnerabilities||{}; console.log(v); if ((v.total||0)!==0) process.exit(1)"
      - name: Verify install, lint and build
        run: |
          npm ci
          cd dashboard-ui
          npm ci
          npm run lint
          npm run build
      - name: Commit only dependency metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dashboard-ui/package.json dashboard-ui/package-lock.json
          git rm -f --ignore-unmatch -- .github/workflows/fix-dashboard-production-audit.yml
          git diff --cached --check
          git commit -m "Resolve dashboard production audit findings"
          git push origin HEAD:hardening/final-security-transaction-review

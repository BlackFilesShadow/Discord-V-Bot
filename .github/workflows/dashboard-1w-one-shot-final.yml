name: Dashboard-1W One Shot Final Patch

on:
  push:
    branches: [fix/dashboard-1w-audit-log-contract]
    paths: [.github/workflows/dashboard-1w-one-shot-final.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/dashboard-1w-audit-log-contract
          fetch-depth: 0
      - name: Apply final source and architecture assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          server_path = Path('dashboard-ui/src/pages/Server.tsx')
          server = server_path.read_text()
          old_button = '<Button type="submit" disabled={list.isFetching && !list.isFetchingNextPage}>Suchen</Button>'
          new_button = '<Button type="submit" disabled={list.isFetching}>Suchen</Button>'
          if old_button not in server:
            raise SystemExit('Audit search button anchor missing')
          server = server.replace(old_button, new_button, 1)

          old_error = '''      {list.isError && (
        <Card>
          <p className="text-danger text-sm">Fehler: {(list.error as ApiError).message}</p>
        </Card>
      )}
'''
          new_error = '''      {list.isError && !list.isFetchNextPageError && (
        <Card>
          <p className="text-danger text-sm">Fehler: {(list.error as ApiError).message}</p>
        </Card>
      )}
      {list.isFetchNextPageError && (
        <Card>
          <p className="text-danger text-sm">Fehler beim Nachladen: {(list.error as ApiError).message}</p>
        </Card>
      )}
'''
          if old_error not in server:
            raise SystemExit('Audit error-state anchor missing')
          server_path.write_text(server.replace(old_error, new_error, 1))

          arch_path = Path('tests/security/dashboardAuditIntegrityArchitecture.test.ts')
          arch = arch_path.read_text()
          anchor = "    expect(uiSource).not.toContain(\"qs.set('before', cursor)\");\n"
          extra = anchor + "    expect(uiSource).toContain('<Button type=\\\"submit\\\" disabled={list.isFetching}>Suchen</Button>');\n    expect(uiSource).toContain('list.isError && !list.isFetchNextPageError');\n    expect(uiSource).toContain('list.isFetchNextPageError && (');\n    expect(uiSource).toContain('Fehler beim Nachladen:');\n"
          if anchor not in arch:
            raise SystemExit('architecture UI anchor missing')
          arch = arch.replace(anchor, extra, 1)
          logger_anchor = "    expect(loggerSource).toContain('details: redactAuditDetails(meta.details ?? null) as never');\n"
          logger_extra = logger_anchor + "    expect(loggerSource).toContain('out[k] = redactAuditDetails(v, k);');\n"
          if logger_anchor not in arch:
            raise SystemExit('architecture logger anchor missing')
          arch_path.write_text(arch.replace(logger_anchor, logger_extra, 1))
          PY

          rm -f .github/workflows/dashboard-1w-one-shot-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard-ui/src/pages/Server.tsx tests/security/dashboardAuditIntegrityArchitecture.test.ts .github/workflows/dashboard-1w-one-shot-final.yml
          git diff --cached --check
          git commit -m "Dashboard-1W: finalize pagination error contract"
          git push origin HEAD:fix/dashboard-1w-audit-log-contract

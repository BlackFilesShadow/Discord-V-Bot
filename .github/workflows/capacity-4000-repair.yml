name: Capacity 4000 repair

on:
  push:
    branches:
      - perf/4000-player-capacity-hardening

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  NODE_OPTIONS: '--max-old-space-size=4096'
  DATABASE_URL: postgresql://test:test@localhost:5432/discord_v_bot_test
  DISCORD_TOKEN: test-token
  DISCORD_CLIENT_ID: test-client-id
  DISCORD_CLIENT_SECRET: test-secret
  BOT_OWNER_ID: '123456789012345678'
  ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  SESSION_SECRET: test-session-secret
  DASHBOARD_URL: http://localhost:3000

jobs:
  capacity-gates:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: discord_v_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm --prefix dashboard-ui ci
      - name: Apply capacity hardening
        run: |
          python3 scripts/apply-capacity-4000-patch.py
          python3 scripts/apply-capacity-4000-hotpath.py
          python3 scripts/apply-capacity-4000-session-fix.py
          python3 scripts/apply-capacity-4000-followup.py
          python3 scripts/apply-capacity-4000-followup-fix.py
          python3 scripts/apply-capacity-4000-deepfix.py
          python3 scripts/apply-capacity-4000-scopefix.py
          python3 scripts/apply-capacity-4000-regressionfix.py
      - name: Validate schema and deploy migrations
        run: |
          npx prisma generate
          npx prisma validate
          npx prisma migrate deploy
          npx prisma migrate status
      - name: Verify targeted 4000-player regressions
        run: |
          npm run lint
          npm run build:server
          npm --prefix dashboard-ui run build
          npx jest --runInBand --coverage=false \
            tests/utils/boundedConcurrency.test.ts \
            tests/modules/serverLogIngestor.test.ts \
            tests/modules/playerListRoster.test.ts \
            tests/modules/playerListRosterCapacity.test.ts \
            tests/modules/playerListRosterSqlArchitecture.test.ts \
            tests/modules/playerSessionService.test.ts \
            tests/modules/playerSessionCapacity4000.test.ts \
            tests/modules/capacity4000FollowupArchitecture.test.ts \
            tests/modules/sessionIdentityLookupCapacity.test.ts \
            tests/modules/capacity4000DeepArchitecture.test.ts \
            tests/ai/userRecognition.test.ts
      - name: Live PostgreSQL 4000-player ingest and directory probe
        run: npm run perf:players-4000
      - name: Stage 47 live data-plane baseline
        run: npm run perf:data-plane-47
        env:
          REDIS_URL: redis://localhost:6379
          STAGE47_REQUIRE_LIVE: '1'
          STAGE47_EXACT_SHA: ${{ github.sha }}
      - name: Stage 48 AI and Nitrado loopback baseline
        run: npm run perf:ai-nitrado-48
        env:
          STAGE48_REQUIRE_LAB: '1'
          STAGE48_EXACT_SHA: ${{ github.sha }}
      - name: Stage 50 production dashboard and PostgreSQL load test
        run: npm run perf:load-50
        env:
          STAGE50_REQUIRE_LIVE: '1'
          STAGE50_EXACT_SHA: ${{ github.sha }}

  full-jest:
    if: ${{ github.actor != 'github-actions[bot]' }}
    needs: capacity-gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: discord_v_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Configure test environment
        shell: bash
        run: |
          echo 'DATABASE_URL=postgresql://test:test@localhost:5432/discord_v_bot_test' >> "$GITHUB_ENV"
          echo 'DISCORD_TOKEN=test-token' >> "$GITHUB_ENV"
          echo 'DISCORD_CLIENT_ID=test-client-id' >> "$GITHUB_ENV"
          echo 'DISCORD_CLIENT_SECRET=test-secret' >> "$GITHUB_ENV"
          echo 'BOT_OWNER_ID=123456789012345678' >> "$GITHUB_ENV"
          printf 'ENCRYPTION_KEY=%064d\n' 0 >> "$GITHUB_ENV"
          echo 'SESSION_SECRET=test-session-secret' >> "$GITHUB_ENV"
          echo 'DASHBOARD_URL=http://localhost:3000' >> "$GITHUB_ENV"
          echo 'REDIS_URL=redis://localhost:6379' >> "$GITHUB_ENV"
      - run: npm ci
      - name: Apply capacity hardening
        run: |
          python3 scripts/apply-capacity-4000-patch.py
          python3 scripts/apply-capacity-4000-hotpath.py
          python3 scripts/apply-capacity-4000-session-fix.py
          python3 scripts/apply-capacity-4000-followup.py
          python3 scripts/apply-capacity-4000-followup-fix.py
          python3 scripts/apply-capacity-4000-deepfix.py
          python3 scripts/apply-capacity-4000-scopefix.py
          python3 scripts/apply-capacity-4000-regressionfix.py
      - name: Prepare database
        run: |
          npx prisma generate
          npx prisma migrate deploy
      - name: Run Full Jest quietly
        id: jest
        continue-on-error: true
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 10m npx jest --runInBand --coverage=false --json --outputFile=jest-results.json >jest-output.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Print concise Jest failures
        if: always()
        shell: bash
        env:
          JEST_STATUS: ${{ steps.jest.outputs.status }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const status = Number(process.env.JEST_STATUS || 1);
          if (!fs.existsSync('jest-results.json')) {
            const raw = fs.existsSync('jest-output.log') ? fs.readFileSync('jest-output.log', 'utf8') : 'No Jest output available';
            console.log('JEST_DIAGNOSTIC_NO_JSON');
            console.log(raw.slice(-16000));
            process.exit(status || 1);
          }
          const result = JSON.parse(fs.readFileSync('jest-results.json', 'utf8'));
          console.log(`JEST_SUMMARY suites_failed=${result.numFailedTestSuites} tests_failed=${result.numFailedTests} suites_total=${result.numTotalTestSuites} tests_total=${result.numTotalTests}`);
          for (const suite of result.testResults || []) {
            const failed = (suite.assertionResults || []).filter(test => test.status === 'failed');
            if (suite.status !== 'failed' && failed.length === 0 && !suite.failureMessage) continue;
            console.log(`FAILED_SUITE ${suite.name}`);
            for (const test of failed) {
              console.log(`FAILED_TEST ${[...(test.ancestorTitles || []), test.title].join(' > ')}`);
              const messages = Array.isArray(test.failureMessages) ? test.failureMessages : [];
              for (const message of messages) console.log(String(message).slice(0, 5000));
            }
            if (failed.length === 0 && suite.failureMessage) console.log(String(suite.failureMessage).slice(0, 5000));
          }
          if (status !== 0 || result.numFailedTestSuites > 0 || result.numFailedTests > 0) process.exit(status || 1);
          NODE

  commit-hardening:
    needs:
      - capacity-gates
      - full-jest
    if: ${{ github.actor != 'github-actions[bot]' && needs.capacity-gates.result == 'success' && needs.full-jest.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/4000-player-capacity-hardening
          fetch-depth: 0
      - name: Verify branch has not moved
        shell: bash
        run: |
          remote_sha=$(git ls-remote origin refs/heads/perf/4000-player-capacity-hardening | awk '{print $1}')
          if [ "$remote_sha" != "${{ github.sha }}" ]; then
            echo "Branch moved during capacity validation: expected ${{ github.sha }}, found $remote_sha" >&2
            exit 1
          fi
      - name: Apply capacity hardening
        run: |
          python3 scripts/apply-capacity-4000-patch.py
          python3 scripts/apply-capacity-4000-hotpath.py
          python3 scripts/apply-capacity-4000-session-fix.py
          python3 scripts/apply-capacity-4000-followup.py
          python3 scripts/apply-capacity-4000-followup-fix.py
          python3 scripts/apply-capacity-4000-deepfix.py
          python3 scripts/apply-capacity-4000-scopefix.py
          python3 scripts/apply-capacity-4000-regressionfix.py
      - name: Commit hardening
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests scripts prisma package.json dashboard-ui docs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'perf(capacity): complete 4000-player hardening'
          git push origin HEAD:perf/4000-player-capacity-hardening

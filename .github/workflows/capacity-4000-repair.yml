          util = Path('src/utils/boundedConcurrency.ts')
          util.write_text("""/** Bounded async worker pool for independent, scoped runtime items. */
export async function forEachBounded<T>(
  items: readonly T[],
  concurrency: number,
  worker: (item: T) => Promise<void>,
): Promise<void> {
  if (!Number.isInteger(concurrency) || concurrency < 1) {
    throw new Error('concurrency must be a positive integer');
  }
  if (items.length === 0) return;

  let cursor = 0;
  const failures: unknown[] = [];
  const runners = Array.from({ length: Math.min(concurrency, items.length) }, async () => {
    while (true) {
      const index = cursor;
      cursor += 1;
      if (index >= items.length) return;
      try {
        await worker(items[index]);
      } catch (error) {
        failures.push(error);
      }
    }
  });

  await Promise.all(runners);
  if (failures.length > 0) {
    throw new AggregateError(failures, `${failures.length} bounded worker task(s) failed`);
  }
}
""", encoding='utf-8')

          tests = Path('tests/utils/boundedConcurrency.test.ts')
          tests.parent.mkdir(parents=True, exist_ok=True)
          tests.write_text("""import { forEachBounded } from '../../src/utils/boundedConcurrency';

describe('forEachBounded', () => {
  it('processes every item exactly once while respecting the concurrency ceiling', async () => {
    let active = 0;
    let peak = 0;
    const seen: number[] = [];
    await forEachBounded(Array.from({ length: 4000 }, (_, index) => index), 4, async item => {
      active += 1;
      peak = Math.max(peak, active);
      if (item % 127 === 0) await new Promise(resolve => setImmediate(resolve));
      seen.push(item);
      active -= 1;
    });
    expect(peak).toBeLessThanOrEqual(4);
    expect(seen).toHaveLength(4000);
    expect(new Set(seen).size).toBe(4000);
  });

  it('waits for all work and then reports failures without abandoning later items', async () => {
    const seen: number[] = [];
    await expect(forEachBounded([1, 2, 3, 4, 5], 2, async item => {
      seen.push(item);
      if (item === 2 || item === 4) throw new Error(`boom-${item}`);
    })).rejects.toBeInstanceOf(AggregateError);
    expect(seen.sort()).toEqual([1, 2, 3, 4, 5]);
  });
});
""", encoding='utf-8')


name: Capacity 4000 repair

on:
  push:
    branches:
      - perf/4000-player-capacity-hardening

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/4000-player-capacity-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply capacity hardening
        run: python3 scripts/apply-capacity-4000-patch.py
      - name: Verify patch
        run: |
          npm run lint
          npm run build:server
          npx jest --runInBand --coverage=false tests/utils/boundedConcurrency.test.ts tests/modules/playerListRoster.test.ts
      - name: Commit hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests scripts package.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'perf(runtime): harden bounded sweeps for 4000-player load'
          git push origin HEAD:perf/4000-player-capacity-hardening

name: TEMP Final DayZ Follow-up Hardening

on:
  push:
    branches: [fix/dayz-events-followup-rate-limit]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/dayz-events-followup-rate-limit
          fetch-depth: 0
      - name: Apply final hardening
        run: python3 .github/scripts/temp_dayz_final2.py
      - name: Commit and clean temporary files
        shell: bash
        run: |
          git rm -f .github/workflows/temp-dayz-final2.yml .github/scripts/temp_dayz_final2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/ai/nitradoHelp.ts src/modules/ai/aiHandler.ts src/events/messageCreate.ts tests/ai/nitradoHelp.test.ts
          git commit -m "Bypass AI limit for grounded DayZ answers"
          git push origin HEAD:fix/dayz-events-followup-rate-limit

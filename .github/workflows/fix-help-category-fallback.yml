name: Fix help category fallback
on:
  push:
    branches: [feat/help-command-catalog]
    paths: [.github/workflows/fix-help-category-fallback.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/help-command-catalog
          fetch-depth: 0
      - run: python3 scripts/fix_help_category_fallback.py
      - run: git diff --check
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/commands/user/help.ts
          git rm -f --ignore-unmatch -- scripts/fix_help_category_fallback.py .github/workflows/fix-help-category-fallback.yml
          git commit -m "Make help category fallback explicit"
          git push origin HEAD:feat/help-command-catalog

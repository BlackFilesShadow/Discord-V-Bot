name: Temporary guarded lint warning cleanup

on:
  push:
    branches:
      - chore/lint-warning-zero

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Remove only stale ESLint directives
        shell: bash
        run: |
          set -euo pipefail
          npx eslint \
            "src/dashboard/routes/v2/devStatus.ts" \
            "src/modules/bans/expiryRuntime.ts" \
            "src/modules/economy/blackMarket.ts" \
            "src/modules/economy/marketDirectBuyContract.ts" \
            "src/modules/economy/playtimeLiveRosterGuard.ts" \
            "src/modules/factions/factionEmbed.ts" \
            "src/modules/gameplayFeeds/runtime.ts" \
            "src/modules/nitrado/jobLease.ts" \
            "src/modules/nitrado/repository.ts" \
            "tests/commands/giveaway.test.ts" \
            "tests/deploy/metricsBootstrap.test.ts" \
            "tests/modules/reminderSchedulerReliability.test.ts" \
            "tests/modules/selfRoleMenu.publish.test.ts" \
            "tests/modules/selfRoleMenu.roles.test.ts" \
            "tests/security/noUnscopedPrismaQuery.test.ts" \
            "tests/security/runtimeBaselines4648Architecture.test.ts" \
            --fix --fix-type directive

      - name: Remove exactly the one unused logger import
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/modules/registration/register.ts';
          const before = "import { logger, logAudit, logSecurity } from '../../utils/logger';";
          const after = "import { logAudit, logSecurity } from '../../utils/logger';";
          const source = fs.readFileSync(path, 'utf8');
          const matches = source.split(before).length - 1;
          if (matches !== 1) {
            throw new Error(`Expected exactly one logger import to replace, found ${matches}`);
          }
          fs.writeFileSync(path, source.replace(before, after));
          NODE

      - name: Prove the diff contains no logic changes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const targets = [
            'src/dashboard/routes/v2/devStatus.ts',
            'src/modules/bans/expiryRuntime.ts',
            'src/modules/economy/blackMarket.ts',
            'src/modules/economy/marketDirectBuyContract.ts',
            'src/modules/economy/playtimeLiveRosterGuard.ts',
            'src/modules/factions/factionEmbed.ts',
            'src/modules/gameplayFeeds/runtime.ts',
            'src/modules/nitrado/jobLease.ts',
            'src/modules/nitrado/repository.ts',
            'src/modules/registration/register.ts',
            'tests/commands/giveaway.test.ts',
            'tests/deploy/metricsBootstrap.test.ts',
            'tests/modules/reminderSchedulerReliability.test.ts',
            'tests/modules/selfRoleMenu.publish.test.ts',
            'tests/modules/selfRoleMenu.roles.test.ts',
            'tests/security/noUnscopedPrismaQuery.test.ts',
            'tests/security/runtimeBaselines4648Architecture.test.ts',
          ];
          const patch = execFileSync('git', ['diff', '--unified=0', '--', ...targets], { encoding: 'utf8' });
          let removedDirectives = 0;
          let removedImport = 0;
          let addedImport = 0;
          const bad = [];
          const oldImport = "-import { logger, logAudit, logSecurity } from '../../utils/logger';";
          const newImport = "+import { logAudit, logSecurity } from '../../utils/logger';";
          for (const line of patch.split('\n')) {
            if (line.startsWith('---') || line.startsWith('+++')) continue;
            if (line.startsWith('-')) {
              if (line.includes('eslint-disable')) removedDirectives += 1;
              else if (line === oldImport) removedImport += 1;
              else bad.push(line);
            } else if (line.startsWith('+')) {
              if (line === newImport) addedImport += 1;
              else bad.push(line);
            }
          }
          if (removedDirectives !== 41 || removedImport !== 1 || addedImport !== 1 || bad.length !== 0) {
            console.error(JSON.stringify({ removedDirectives, removedImport, addedImport, bad }, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify({ removedDirectives, removedImport, addedImport, otherChangedLines: 0 }));
          NODE

      - name: Require zero root lint warnings
        run: npx eslint "src/**/*.ts" "tests/**/*.ts" --max-warnings=0

      - name: Require clean whitespace diff
        run: git diff --check

      - name: Remove temporary workflow and verify exact changed-file set
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-lint-warning-zero.yml
          cat > /tmp/expected-files <<'EOF'
          .github/workflows/tmp-lint-warning-zero.yml
          src/dashboard/routes/v2/devStatus.ts
          src/modules/bans/expiryRuntime.ts
          src/modules/economy/blackMarket.ts
          src/modules/economy/marketDirectBuyContract.ts
          src/modules/economy/playtimeLiveRosterGuard.ts
          src/modules/factions/factionEmbed.ts
          src/modules/gameplayFeeds/runtime.ts
          src/modules/nitrado/jobLease.ts
          src/modules/nitrado/repository.ts
          src/modules/registration/register.ts
          tests/commands/giveaway.test.ts
          tests/deploy/metricsBootstrap.test.ts
          tests/modules/reminderSchedulerReliability.test.ts
          tests/modules/selfRoleMenu.publish.test.ts
          tests/modules/selfRoleMenu.roles.test.ts
          tests/security/noUnscopedPrismaQuery.test.ts
          tests/security/runtimeBaselines4648Architecture.test.ts
          EOF
          git diff --name-only | sort > /tmp/actual-files
          sort /tmp/expected-files -o /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Commit guarded cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(lint): remove stale warning suppressions'
          git push origin HEAD:chore/lint-warning-zero

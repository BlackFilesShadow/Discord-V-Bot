name: TEMP Dashboard Lock Refresh

on:
  push:
    branches: [fix/dashboard-ui-security-audit]

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/dashboard-ui-security-audit
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard-ui/package-lock.json
      - name: Refresh lock with non-breaking audit fixes only
        working-directory: dashboard-ui
        run: |
          npm ci
          npm audit fix --package-lock-only || true
          npm audit --omit=dev --json > production-audit.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const audit = JSON.parse(fs.readFileSync('production-audit.json', 'utf8'));
          const counts = audit.metadata?.vulnerabilities ?? {};
          console.log('Production audit:', JSON.stringify(counts));
          if ((counts.high ?? 0) > 0 || (counts.critical ?? 0) > 0) process.exit(1);
          NODE
      - name: Commit only refreshed dashboard lock
        shell: bash
        run: |
          set -euo pipefail
          rm -f dashboard-ui/production-audit.json
          git status --short
          git diff --exit-code -- . ':!dashboard-ui/package-lock.json'
          git add dashboard-ui/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: refresh dashboard production dependency lock [skip ci]'
          git push origin HEAD:fix/dashboard-ui-security-audit

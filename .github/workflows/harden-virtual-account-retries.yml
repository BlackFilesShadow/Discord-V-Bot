name: Virtual accounts one-shot retry hardening

on:
  push:
    branches:
      - feat/economy-virtual-accounts
    paths:
      - .github/workflows/harden-virtual-account-retries.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/economy-virtual-accounts
          fetch-depth: 0
      - name: Apply retry and idempotency hardening
        run: python3 scripts/harden_virtual_account_retries.py
      - name: Validate patch whitespace
        run: git diff --check
      - name: Commit hardening and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/modules/economy/virtualAccounts.ts src/dashboard/routes/v2/economyVirtualAccounts.ts dashboard-ui/src/lib/api.ts dashboard-ui/src/components/economy/VirtualAccountsPanel.tsx tests/modules/economyVirtualAccounts.test.ts
          git rm -- scripts/harden_virtual_account_retries.py .github/workflows/harden-virtual-account-retries.yml
          git commit -m "Harden virtual account retries and replay safety"
          git push origin HEAD:feat/economy-virtual-accounts

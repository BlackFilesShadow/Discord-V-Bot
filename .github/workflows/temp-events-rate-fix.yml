name: TEMP Finalize Events XML Fix

on:
  push:
    branches: [fix/dayz-events-followup-rate-limit]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/dayz-events-followup-rate-limit
          fetch-depth: 0
      - name: Finalize source and tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/modules/ai/nitradoHelp.ts')
          s = p.read_text()
          s = s.replace("].join('\\\\n');", "].join('\\n');")
          p.write_text(s)

          p = Path('tests/ai/nitradoHelp.test.ts')
          s = p.read_text()
          s = s.replace(
              "    expect(a.directAnswer).not.toMatch(/Start-.*Endzeit|Regenphasen|Zombie-Wellen.*festgelegten Zeiten/i);",
              "    expect(a.directAnswer).toMatch(/nicht.*Start-\\/Endzeit/i);",
          )
          p.write_text(s)
          PY
          git rm -f .github/workflows/temp-events-rate-fix.yml .github/scripts/temp_events_patch.py .github/scripts/fix_temp_events_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/ai/nitradoHelp.ts tests/ai/nitradoHelp.test.ts
          git commit -m "Finalize events.xml grounding fix"
          git push origin HEAD:fix/dayz-events-followup-rate-limit

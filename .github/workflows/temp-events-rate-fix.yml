name: TEMP Events XML and Rate Limit Fix

on:
  push:
    branches: [fix/dayz-events-followup-rate-limit]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/dayz-events-followup-rate-limit
          fetch-depth: 0
      - name: Repair patch matcher
        run: python3 .github/scripts/fix_temp_events_patch.py
      - name: Apply patch
        run: python3 .github/scripts/temp_events_patch.py
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already patched; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/ai/nitradoHelp.ts src/modules/ai/dayzKnowledge.ts src/modules/ai/aiHandler.ts src/utils/rateLimiter.ts src/events/messageCreate.ts tests/ai/nitradoHelp.test.ts
          git commit -m "Ground events.xml answers and distinguish rate limits"
          git push origin HEAD:fix/dayz-events-followup-rate-limit

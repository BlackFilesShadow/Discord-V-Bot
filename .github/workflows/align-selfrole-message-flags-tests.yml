name: Align self-role MessageFlags tests
on:
  push:
    branches: [fix/postdeploy-dashboard-economy-help-killfeed]
    paths: [.github/workflows/align-selfrole-message-flags-tests.yml]
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/postdeploy-dashboard-economy-help-killfeed
          fetch-depth: 0
      - run: python3 scripts/align_selfrole_message_flags_tests.py
      - run: git diff --check
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tests/modules/selfRoleMenu.roles.test.ts tests/modules/selfRoleMenu.optionBehavior.test.ts
          git rm -f --ignore-unmatch -- scripts/align_selfrole_message_flags_tests.py .github/workflows/align-selfrole-message-flags-tests.yml
          git commit -m "Align self-role tests with MessageFlags"
          git push origin HEAD:fix/postdeploy-dashboard-economy-help-killfeed

name: Stage45 dashboard lock refresh

on:
  push:
    branches:
      - fix/stage-45-dashboard-vite-audit

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/stage-45-dashboard-vite-audit
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard-ui/package-lock.json
      - name: Regenerate dashboard lockfile from declared dependencies
        working-directory: dashboard-ui
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify dashboard full audit has no HIGH/CRITICAL findings
        working-directory: dashboard-ui
        run: npm audit --audit-level=high
      - name: Commit generated lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- dashboard-ui/package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard-ui/package-lock.json
          git commit -m "chore(security): refresh dashboard lock for Vite 6.4.3"
          git push origin HEAD:fix/stage-45-dashboard-vite-audit

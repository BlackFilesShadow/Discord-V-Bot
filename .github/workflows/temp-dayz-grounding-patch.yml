name: TEMP DayZ Grounding Patch

on:
  push:
    branches: [fix/dayz-fail-closed-grounding]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/dayz-fail-closed-grounding
          fetch-depth: 0
      - name: Apply fail-closed DayZ handler patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/modules/ai/aiHandler.ts')
          s = p.read_text()

          old_import = "import { lookupNitradoHelp, looksLikeDayZFileQuestion, getDayZFileTruthBlock, detectTypesXmlValueViolations, sanitizeDayZLootValues, looksLikeDayZLootContent } from './nitradoHelp';"
          new_import = "import { lookupNitradoHelp, looksLikeDayZFileQuestion, getDayZFileTruthBlock, isDayzTechnicalAdminQuestion, validateDayzTechnicalAnswer, buildDayzTechnicalFallback } from './nitradoHelp';"
          if old_import in s:
              s = s.replace(old_import, new_import, 1)

          old_web = "  const wantWebSearch = mode === 'chat' || mode === 'oneshot' || mode === 'trigger';"
          new_web = """  const dayzTechnical = mode !== 'welcome' && isDayzTechnicalAdminQuestion(question);
          // Technical DayZ config is closed-world: generic Wikipedia/DDG must not
          // compete with verified 1.29/Bohemia grounding.
          const wantWebSearch = (mode === 'chat' || mode === 'oneshot' || mode === 'trigger') && !dayzTechnical;"""
          if old_web in s:
              s = s.replace(old_web, new_web, 1)

          needle = "        nitradoHelpTopics = ans.topicIds;\n"
          if needle in s and 'if (ans.directAnswer)' not in s:
              direct = """        nitradoHelpTopics = ans.topicIds;
                  // High-risk technical topics can bypass the LLM completely.
                  if (ans.directAnswer) {
                    const direct = redactText(ans.directAnswer);
                    if (useMemory) {
                      void (async () => {
                        try {
                          const { recordTurn } = await import('./conversationMemory.js');
                          await recordTurn(opts.userId!, opts.channelId!, 'user', question, opts.guildId ?? null);
                          await recordTurn(opts.userId!, opts.channelId!, 'assistant', direct, opts.guildId ?? null);
                        } catch (e) {
                          logger.warn(`conversationMemory.recordTurn fuer DayZ directAnswer fehlgeschlagen: ${String(e)}`);
                        }
                      })();
                    }
                    logger.info(`[DayZ-Grounding] deterministische Antwort (topics=${ans.topicIds.join(',')})`);
                    return { success: true, result: direct };
                  }
          """
              s = s.replace(needle, direct, 1)

          mem_start = s.find('    // Wenn der Wahrheits-Block injiziert wird, vorherige assistant-Turns mit')
          mem_end = s.find('    const response = await callAI([', mem_start)
          if mem_start != -1 and mem_end != -1:
              new_mem = """    // Old assistant hallucinations must not re-enter technical DayZ prompts.
              if (dayzTechnical && nitradoHelpBlock && memoryTurns.length > 0) {
                const before = memoryTurns.length;
                memoryTurns = memoryTurns.filter((t) => {
                  if (t.role !== 'assistant') return true;
                  return validateDayzTechnicalAnswer(t.content, nitradoHelpBlock!, question).valid;
                });
                if (memoryTurns.length < before) {
                  logger.info(`[DayZ-Grounding] ${before - memoryTurns.length} ungrounded Memory-Turn(s) gefiltert`);
                }
              }

          """
              s = s[:mem_start] + new_mem + s[mem_end:]

          guard_start = s.find('    // HARTE GRENZE')
          guard_end = s.find('    // Phase 14: Turn persistieren', guard_start)
          if guard_start != -1 and guard_end != -1:
              new_guard = """    // Fail closed after generation: unknown technical identifiers never reach Discord.
              if (dayzTechnical && safeResponse) {
                const grounding = nitradoHelpBlock ?? getDayZFileTruthBlock();
                const validation = validateDayzTechnicalAnswer(safeResponse, grounding, question);
                if (!validation.valid) {
                  logger.warn(`[DayZ-Grounding] LLM-Antwort blockiert: ${validation.violations.join('; ')}`);
                  safeResponse = buildDayzTechnicalFallback(question, validation.violations);
                }
              }

          """
              s = s[:guard_start] + new_guard + s[guard_end:]

          required = [
              'isDayzTechnicalAdminQuestion(question)',
              'if (ans.directAnswer)',
              'validateDayzTechnicalAnswer(safeResponse, grounding, question)',
              'buildDayzTechnicalFallback(question, validation.violations)',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit(f'patch incomplete, missing: {missing}')
          p.write_text(s)
          PY

          if git diff --quiet -- src/modules/ai/aiHandler.ts; then
            echo "Handler already patched; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/ai/aiHandler.ts
          git commit -m "Fail closed on ungrounded DayZ AI output"
          git push origin HEAD:fix/dayz-fail-closed-grounding

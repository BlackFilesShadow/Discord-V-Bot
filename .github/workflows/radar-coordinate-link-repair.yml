name: Radar coordinate link repair

on:
  push:
    branches:
      - fix/radar-coordinate-izurvive-link

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/radar-coordinate-izurvive-link
          fetch-depth: 0
      - name: Make radar coordinates directly clickable
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('src/modules/radar/runtime.ts')
          text = runtime.read_text()
          old = "  return url ? `${label}\\n[iZurvive öffnen](${url})` : label;"
          new = "  return url ? `[${label}](${url})` : label;"
          if old not in text:
              raise SystemExit('Radar coordinate output target not found')
          runtime.write_text(text.replace(old, new, 1))

          test = Path('tests/modules/radarRuntime.test.ts')
          text = test.read_text()
          old = "    expect(fields.find(field => field.name === 'Koordinaten X/Z')?.value).toContain('X: 100.0 · Z: 200.0');\n    expect(fields.find(field => field.name === 'Koordinaten X/Z')?.value).toContain('iZurvive öffnen');"
          new = "    expect(fields.find(field => field.name === 'Koordinaten X/Z')?.value)\n      .toBe('[X: 100.0 · Z: 200.0](https://www.izurvive.com/chernarusplus/#location=100;200;6)');"
          if old not in text:
              raise SystemExit('Radar coordinate regression target not found')
          test.write_text(text.replace(old, new, 1))
          PY
      - name: Remove temporary workflow and commit patch
        shell: bash
        run: |
          git rm .github/workflows/radar-coordinate-link-repair.yml
          git add src/modules/radar/runtime.ts tests/modules/radarRuntime.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(radar): link coordinates directly to iZurvive'
          git push origin HEAD:fix/radar-coordinate-izurvive-link

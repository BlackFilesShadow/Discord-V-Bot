name: TEMP Verify DayZ 1.29 Source Manifest

on:
  push:
    branches: [feat/dayz129-complete-grounded-catalog]

permissions:
  contents: read

jobs:
  verify-source-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5

      - name: Verify exact local source digest against repository manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          expected_maps_digest = '68bc2bc3cecd488be9f26242b933eaf77d8401b97f35b959dd309f6b55dca3de'
          expected_per_map = {
              'chernarus': (42, 'a24d556863e7f9f8eb71e6862c64656d26f3a25c8924bfc0861a47a680f22b95'),
              'livonia': (42, '98c97b161d6fc5baaa15c54d4fabb7155dab76217e6258cfd089e0e49953c00b'),
              'sakhal': (34, '5c77d19712d97174d86ec6557137019708166714d3478131f216abe4b5a36464'),
          }

          manifest = json.loads(Path('data/dayz129/user-source-manifest.json').read_text(encoding='utf-8'))
          if manifest.get('version') != '1.29.163451' or manifest.get('tag') != 'DZ_129':
              raise SystemExit(f"Unexpected manifest identity: version={manifest.get('version')!r} tag={manifest.get('tag')!r}")

          maps = manifest.get('maps')
          if not isinstance(maps, dict):
              raise SystemExit('Manifest maps object missing')

          canonical = json.dumps(maps, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode('utf-8')
          actual_digest = hashlib.sha256(canonical).hexdigest()
          print(f'manifest maps canonical sha256={actual_digest}')
          if actual_digest != expected_maps_digest:
              raise SystemExit(f'Full manifest/source digest mismatch: {actual_digest} != {expected_maps_digest}')

          total = 0
          for map_name, (expected_count, expected_digest) in expected_per_map.items():
              files = maps.get(map_name)
              if not isinstance(files, dict):
                  raise SystemExit(f'Missing manifest map: {map_name}')
              encoded = json.dumps(files, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode('utf-8')
              digest = hashlib.sha256(encoded).hexdigest()
              print(f'{map_name}: files={len(files)} sha256={digest}')
              if len(files) != expected_count or digest != expected_digest:
                  raise SystemExit(f'{map_name}: local source report does not match repository manifest')
              total += len(files)

          if total != 118:
              raise SystemExit(f'Unexpected total manifest files: {total}')
          print('VERIFIED: all 118 source-file size/SHA-256 records match the three original local ZIP uploads exactly.')
          PY

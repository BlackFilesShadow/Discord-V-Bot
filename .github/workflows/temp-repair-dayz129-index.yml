name: TEMP Regenerate Verified DayZ 1.29 Index

on:
  push:
    branches: [feat/dayz129-complete-grounded-catalog]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: feat/dayz129-complete-grounded-catalog
          fetch-depth: 0

      - name: Checkout official Bohemia DZ_129 source
        shell: bash
        run: |
          git clone --depth 1 --branch DZ_129 https://github.com/BohemiaInteractive/DayZ-Central-Economy.git /tmp/dayz-ce

      - name: Make generator deterministic and chunk-aware
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/generate_dayz129_index.py')
          text = path.read_text(encoding='utf-8')

          old_xml = '''def xml_summary(path: Path) -> dict:\n    root = ET.parse(path).getroot()\n    tags = Counter(clean_tag(el.tag) for el in root.iter())\n    attrs = Counter(attr for el in root.iter() for attr in el.attrib)\n    top = Counter(clean_tag(child.tag) for child in list(root))\n    return {\n        "root": clean_tag(root.tag),\n        "elementCounts": dict(tags.most_common()),\n        "attributeCounts": dict(attrs.most_common()),\n        "topLevelTags": dict(top.most_common()),\n    }\n'''
          new_xml = '''def xml_summary(path: Path) -> dict:\n    try:\n        root = ET.parse(path).getroot()\n    except ET.ParseError as exc:\n        # Preserve malformed supplied source bytes. Structural indexing records\n        # the parser error; semantic db/types.xml and db/events.xml stay strict.\n        return {"format": "xml", "parseError": str(exc)}\n    tags = Counter(clean_tag(el.tag) for el in root.iter())\n    attrs = Counter(attr for el in root.iter() for attr in el.attrib)\n    top = Counter(clean_tag(child.tag) for child in list(root))\n    return {\n        "root": clean_tag(root.tag),\n        "elementCounts": dict(tags.most_common()),\n        "attributeCounts": dict(attrs.most_common()),\n        "topLevelTags": dict(top.most_common()),\n    }\n'''
          if old_xml not in text:
              raise SystemExit('Expected xml_summary block not found')
          text = text.replace(old_xml, new_xml, 1)

          text = text.replace(
              'index["allTypeNames"] = sorted(all_types, key=str.lower)',
              'index["allTypeNames"] = sorted(all_types, key=lambda value: (value.lower(), value))',
              1,
          )
          text = text.replace(
              'index["allEventNames"] = sorted(all_events, key=str.lower)',
              'index["allEventNames"] = sorted(all_events, key=lambda value: (value.lower(), value))',
              1,
          )

          start = text.index('def write_ts(index: dict, output: Path) -> None:')
          end = text.index('\ndef main() -> None:', start)
          replacement = '''def verify_index(index: dict) -> None:\n    expected = {"types": 1974, "events": 72, "paths": 47}\n    actual = {\n        "types": len(index["allTypeNames"]),\n        "events": len(index["allEventNames"]),\n        "paths": len(index["allRelativePaths"]),\n    }\n    if actual != expected:\n        raise SystemExit(f"Unexpected corpus stats: {actual} != {expected}")\n    expected_maps = {\n        "chernarus": (42, 1942, 59),\n        "livonia": (42, 1939, 53),\n        "sakhal": (34, 1955, 62),\n    }\n    for name, (files, types, events) in expected_maps.items():\n        data = index["maps"][name]\n        actual_map = (len(data["files"]), len(data["types"]), len(data["events"]))\n        if actual_map != (files, types, events):\n            raise SystemExit(f"Unexpected {name} stats: {actual_map}")\n\n\ndef write_chunks(index: dict, output_dir: Path) -> None:\n    names = [\n        "chunk00", "chunk01", "chunk02", "chunk03",\n        "tail00", "tail01", "tail02", "tail03", "tail04", "tail05", "tail06",\n    ]\n    lengths = [8000, 8000, 8000, 8000, 16000, 16000, 16000, 16000, 16000, 16000]\n    raw = json.dumps(index, ensure_ascii=False, separators=(",", ":")).encode("utf-8")\n    packed = gzip.compress(raw, compresslevel=9, mtime=0)\n    b64 = base64.b64encode(packed).decode("ascii")\n    parts = []\n    offset = 0\n    for length in lengths:\n        part = b64[offset:offset + length]\n        if len(part) != length:\n            raise SystemExit("Generated payload is too short for chunk layout")\n        parts.append(part)\n        offset += length\n    parts.append(b64[offset:])\n    if len(parts) != len(names) or not parts[-1] or "".join(parts) != b64:\n        raise SystemExit("Chunk split failed")\n    if gzip.decompress(base64.b64decode("".join(parts), validate=True)) != raw:\n        raise SystemExit("Chunk round-trip verification failed")\n    output_dir.mkdir(parents=True, exist_ok=True)\n    for name, part in zip(names, parts):\n        (output_dir / f"{name}.ts").write_text(\n            f"export default '{part}' as const;\\n", encoding="utf-8"\n        )\n    print(\n        f"Generated {output_dir}: raw={len(raw)} gzip={len(packed)} "\n        f"base64={len(b64)} types={len(index['allTypeNames'])} "\n        f"events={len(index['allEventNames'])} paths={len(index['allRelativePaths'])}"\n    )\n'''
          text = text[:start] + replacement + text[end:]

          old_arg = '    ap.add_argument("--output", default="src/modules/ai/generated/dayz129IndexData.ts", type=Path)\n'
          new_arg = '    ap.add_argument("--output-dir", default="src/modules/ai/generated/dayz129IndexChunks", type=Path)\n'
          if old_arg not in text:
              raise SystemExit('Expected output argument not found')
          text = text.replace(old_arg, new_arg, 1)

          old_call = '    write_ts(build_index(args.source, manifest), args.output)\n'
          new_call = '    index = build_index(args.source, manifest)\n    verify_index(index)\n    write_chunks(index, args.output_dir)\n'
          if old_call not in text:
              raise SystemExit('Expected write_ts call not found')
          text = text.replace(old_call, new_call, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify source bytes and regenerate runtime chunks
        shell: bash
        run: |
          python3 scripts/generate_dayz129_index.py --source /tmp/dayz-ce

      - name: Verify regenerated payload identity
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          import re
          from pathlib import Path

          names = [
              'chunk00', 'chunk01', 'chunk02', 'chunk03',
              'tail00', 'tail01', 'tail02', 'tail03', 'tail04', 'tail05', 'tail06',
          ]
          root = Path('src/modules/ai/generated/dayz129IndexChunks')
          parts = []
          for name in names:
              text = (root / f'{name}.ts').read_text(encoding='utf-8')
              match = re.fullmatch(r"export default '([A-Za-z0-9+/=]+)' as const;\s*", text)
              if not match:
                  raise SystemExit(f'{name}: unexpected module format')
              parts.append(match.group(1))

          encoded = ''.join(parts)
          payload_hash = hashlib.sha256(encoded.encode('ascii')).hexdigest()
          expected_payload_hash = 'bdb221a82051429d92ce0b004749e22135f27910de9831a822006bae72c598dd'
          if payload_hash != expected_payload_hash:
              raise SystemExit(f'Payload identity mismatch: {payload_hash} != {expected_payload_hash}')

          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          raw_hash = hashlib.sha256(raw).hexdigest()
          expected_raw_hash = '58d33cfd785d73de1729966b07a6951a286f63aab4ed0651ae88c094fe530813'
          if raw_hash != expected_raw_hash:
              raise SystemExit(f'Raw index identity mismatch: {raw_hash} != {expected_raw_hash}')

          index = json.loads(raw.decode('utf-8'))
          stats = {
              'types': len(index['allTypeNames']),
              'events': len(index['allEventNames']),
              'paths': len(index['allRelativePaths']),
          }
          if index['version'] != '1.29.163451' or stats != {'types': 1974, 'events': 72, 'paths': 47}:
              raise SystemExit(f'Runtime verification failed: version={index.get("version")} stats={stats}')
          print(f'VERIFIED payload={payload_hash} raw={raw_hash} stats={stats}')
          PY

      - name: Commit verified regeneration and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-repair-dayz129-index.yml
          git add scripts/generate_dayz129_index.py src/modules/ai/generated/dayz129IndexChunks
          git diff --cached --check
          git commit -m 'fix(ai): regenerate verified DayZ 1.29 runtime index'
          git push origin HEAD:feat/dayz129-complete-grounded-catalog

name: Final security safe fixes
on:
  push:
    branches: [hardening/final-security-transaction-review]
    paths: [.github/workflows/final-security-safe-fixes.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/final-security-transaction-review
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard-ui/package-lock.json
      - run: python3 scripts/final_security_safe_fixes.py
      - run: npm audit fix --package-lock-only || true
      - run: npm audit fix --package-lock-only || true
        working-directory: dashboard-ui
      - run: git diff --check
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/events/messageReactionAdd.ts src/events/messageReactionRemove.ts package-lock.json dashboard-ui/package-lock.json
          git rm -f --ignore-unmatch -- scripts/final_security_safe_fixes.py .github/workflows/final-security-safe-fixes.yml
          git commit -m "Harden poll transactions and refresh safe dependency locks"
          git push origin HEAD:hardening/final-security-transaction-review

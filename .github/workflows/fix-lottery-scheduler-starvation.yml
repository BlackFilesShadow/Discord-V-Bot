name: Lottery one-shot scheduler starvation fix

on:
  push:
    branches: [feat/economy-lottery]
    paths: [.github/workflows/fix-lottery-scheduler-starvation.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/economy-lottery
          fetch-depth: 0
      - run: python3 scripts/fix_lottery_scheduler_starvation.py
      - run: git diff --check
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/modules/economy/lottery.ts tests/security/economyLotterySafety.test.ts
          git rm -f --ignore-unmatch -- scripts/fix_lottery_scheduler_starvation.py .github/workflows/fix-lottery-scheduler-starvation.yml
          git commit -m "Prevent lottery settlement scheduler starvation"
          git push origin HEAD:feat/economy-lottery

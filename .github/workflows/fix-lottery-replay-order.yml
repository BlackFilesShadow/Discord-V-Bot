name: Lottery one-shot replay ordering fix

on:
  push:
    branches: [feat/economy-lottery]
    paths: [.github/workflows/fix-lottery-replay-order.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/economy-lottery
          fetch-depth: 0
      - run: python3 scripts/move_lottery_replay_before_status.py
      - run: git diff --check
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/modules/economy/lottery.ts
          git rm -- scripts/move_lottery_replay_before_status.py scripts/harden_lottery_replay.py .github/workflows/fix-lottery-replay-order.yml
          git commit -m "Finalize lottery replay and scheduler hardening"
          git push origin HEAD:feat/economy-lottery

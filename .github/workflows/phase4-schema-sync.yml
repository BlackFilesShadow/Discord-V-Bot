name: Phase4 Prisma Schema Sync

on:
  push:
    branches:
      - fix/baseline-idempotency-drift
    paths:
      - .github/workflows/phase4-schema-sync.yml

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

jobs:
  sync-schema:
    name: Validate and commit Phase4 schema sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: fix/baseline-idempotency-drift
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Apply exact schema replacements
        run: node scripts/phase4-schema-sync-once.cjs

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Verify targeted diff
        run: |
          git diff --check -- prisma/schema.prisma
          git diff -- prisma/schema.prisma

      - name: Commit validated schema sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- prisma/schema.prisma
          git diff --cached --check
          git commit -m "fix(prisma): align economy models with server scope"
          git push origin HEAD:fix/baseline-idempotency-drift

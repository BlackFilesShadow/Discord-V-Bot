name: Pre-deploy runtime dependency hardening

on:
  push:
    branches: [hardening/pre-deploy-runtime-dependencies]
    paths: [.github/workflows/predeploy-runtime-dependency-hardening.yml]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hardening/pre-deploy-runtime-dependencies
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard-ui/package-lock.json
      - name: Install current dependencies
        run: npm ci
      - name: Verify uuid runtime usage before removal
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE "from ['\"]uuid['\"]|require\(['\"]uuid['\"]\)" src prisma scripts --include='*.ts' --include='*.js'; then
            echo 'Direct uuid runtime import still exists; refusing automatic removal.' >&2
            exit 1
          fi
          echo 'No direct uuid runtime imports found.'
      - name: Harden direct runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm uninstall uuid
          npm uninstall --save-dev @types/uuid || true
          npm install fast-xml-parser@^5.11.0 multer@^2.0.0
      - name: Require clean production audit
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --json > /tmp/root-prod-audit.json || true
          node -e "const a=require('/tmp/root-prod-audit.json'); const v=a.metadata?.vulnerabilities||{}; console.log('production audit:',v); if ((v.total||0)!==0) process.exit(1)"
      - name: Install dashboard dependencies
        working-directory: dashboard-ui
        run: npm ci
      - name: Verify lint and full production build
        run: |
          npm run lint:all
          npm run build
      - name: Commit validated dependency hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          git rm -f --ignore-unmatch -- .github/workflows/predeploy-runtime-dependency-hardening.yml
          git diff --cached --check
          git commit -m "Harden pre-deploy runtime dependencies"
          git push origin HEAD:hardening/pre-deploy-runtime-dependencies

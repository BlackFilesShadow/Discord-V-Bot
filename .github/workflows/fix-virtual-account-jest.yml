name: Virtual accounts one-shot Jest fix

on:
  push:
    branches:
      - feat/economy-virtual-accounts
    paths:
      - .github/workflows/fix-virtual-account-jest.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/economy-virtual-accounts
          fetch-depth: 0
      - name: Apply focused Jest findings
        run: python3 scripts/fix_virtual_account_jest.py
      - name: Validate patch whitespace
        run: git diff --check
      - name: Commit fixes and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/modules/economy/virtualAccounts.ts tests/security/economyVirtualAccountsSafety.test.ts
          git rm -- scripts/fix_virtual_account_jest.py .github/workflows/fix-virtual-account-jest.yml
          git commit -m "Fix virtual account validation regressions"
          git push origin HEAD:feat/economy-virtual-accounts

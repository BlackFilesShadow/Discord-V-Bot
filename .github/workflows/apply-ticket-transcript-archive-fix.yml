name: Apply ticket transcript archive fix

on:
  push:
    branches:
      - fix/ticket-transcript-archive-images

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ticket-transcript-archive-images
          fetch-depth: 0

      - name: Apply structural source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/modules/tickets/ticketSystem.ts')
          text = path.read_text()

          def once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              text = text.replace(old, new, 1)

          def section(start: str, end: str, replacement: str, label: str) -> None:
              global text
              s = text.find(start)
              if s < 0:
                  raise SystemExit(f'{label}: start marker missing')
              e = text.find(end, s + len(start))
              if e < 0:
                  raise SystemExit(f'{label}: end marker missing')
              text = text[:s] + replacement + text[e:]

          once(
              "import { config } from '../../config';",
              """import { config } from '../../config';
          import {
            archiveTranscriptAttachments,
            isInlineTranscriptImage,
            type TranscriptArchivedAttachment,
          } from './transcriptAttachmentArchive';""",
              'archive import',
          )

          section(
              'interface CollectedMessage {',
              '\n\ninterface TranscriptMeta {',
              '''interface CollectedMessage {
            id: string;
            authorId: string;
            authorName: string;
            isBot: boolean;
            createdAt: Date;
            content: string;
            attachments: TranscriptArchivedAttachment[];
            hasEmbeds: boolean;
          }

          function collectMessage(m: Message): CollectedMessage {
            const authorName = m.member?.displayName
              ?? m.author?.globalName
              ?? m.author?.username
              ?? 'Unbekannt';
            const attachments: TranscriptArchivedAttachment[] = [];
            for (const a of m.attachments.values()) {
              attachments.push({
                id: a.id,
                name: a.name ?? 'attachment',
                url: a.url,
                contentType: a.contentType ?? null,
                size: a.size,
                archivedDataUrl: null,
              });
            }
            return {
              id: m.id,
              authorId: m.author?.id ?? '0',
              authorName,
              isBot: Boolean(m.author?.bot),
              createdAt: m.createdAt,
              content: m.content ?? '',
              attachments,
              hasEmbeds: m.embeds.length > 0,
            };
          }''',
              'message attachment model',
          )

          section(
              "    const atts = m.attachments.length === 0 ? '' :",
              '    return `<div class="msg">',
              '''    const atts = m.attachments.length === 0 ? '' :
              `<div class="atts">${m.attachments.map(a => {
                const href = a.archivedDataUrl ?? a.url;
                const safeHref = htmlEscape(href);
                const safeName = htmlEscape(a.name);
                const image = a.archivedDataUrl && isInlineTranscriptImage(a.contentType)
                  ? `<img src="${safeHref}" alt="${safeName}" loading="lazy">`
                  : '';
                const linkAttrs = a.archivedDataUrl
                  ? ` download="${safeName}"`
                  : ' target="_blank" rel="noopener"';
                return `<div class="att">${image}<a class="att-link" href="${safeHref}"${linkAttrs}>📎 ${safeName}</a></div>`;
              }).join('')}</div>`;
          ''',
              'attachment html',
          )

          section(
              '  .msg .atts {',
              '  .muted {',
              '''  .msg .atts { margin-top: 8px; display: block; }
            .msg .att { margin-top: 8px; }
            .msg .att:first-child { margin-top: 0; }
            .msg .att img { display: block; max-width: 100%; max-height: 720px; width: auto; height: auto;
              object-fit: contain; border: 1px solid #2a313b; border-radius: 8px; background: #090b0e; margin-bottom: 6px; }
            .msg .att-link { display: inline-block; font-size: 12px; color: #8ab4f8; text-decoration: none;
              background: #1a2027; padding: 3px 8px; border-radius: 4px; }
            .msg .att-link:hover { background: #232b34; }
          ''',
              'attachment css',
          )

          # System-Close beim Template-Purge: ebenfalls vor einer Channel-Loeschung sichern.
          sys_start = text.find('export async function  purgeTemplateInstances')
          if sys_start < 0:
              raise SystemExit('system close function missing')
          sys_anchor = '        collectedMsgs = collected.map(collectMessage);\n      }\n\n      const meta: TranscriptMeta = {'
          sys_pos = text.find(sys_anchor, sys_start)
          if sys_pos < 0:
              raise SystemExit('system close collection anchor missing')
          text = text[:sys_pos] + sys_anchor.replace(
              '\n\n      const meta: TranscriptMeta = {',
              '\n\n      const attachmentArchive = await archiveTranscriptAttachments(collectedMsgs);\n\n      const meta: TranscriptMeta = {',
          ) + text[sys_pos + len(sys_anchor):]

          sys_log_start = text.find("      logAudit('TICKET_CLOSED_SYSTEM', 'TICKET', {", sys_start)
          if sys_log_start < 0:
              raise SystemExit('system audit missing')
          sys_line = '        messages: collectedMsgs.length,'
          sys_line_pos = text.find(sys_line, sys_log_start)
          if sys_line_pos < 0:
              raise SystemExit('system audit message line missing')
          text = text[:sys_line_pos] + '''        messages: collectedMsgs.length,
                archivedAttachments: attachmentArchive.attachmentCount,
                archivedAttachmentBytes: attachmentArchive.archivedBytes,'''+ text[sys_line_pos + len(sys_line):]

          # Normaler Close: Channel nach dem Lock verfolgen, damit ein Archivfehler ihn nicht tot hinterlaesst.
          manual_start = text.find('async function closeTicketLocked')
          if manual_start < 0:
              raise SystemExit('manual close function missing')
          defer_anchor = '  await btn.deferReply({ flags: MessageFlags.Ephemeral });\n\n  try {'
          defer_pos = text.find(defer_anchor, manual_start)
          if defer_pos < 0:
              raise SystemExit('manual defer anchor missing')
          replacement = '  await btn.deferReply({ flags: MessageFlags.Ephemeral });\n\n  let lockedChannel: TextChannel | null = null;\n  try {'
          text = text[:defer_pos] + replacement + text[defer_pos + len(defer_anchor):]

          ch_anchor = '    const ch = channel as TextChannel;'
          ch_pos = text.find(ch_anchor, manual_start)
          if ch_pos < 0:
              raise SystemExit('manual channel anchor missing')
          text = text[:ch_pos] + ch_anchor + '\n    lockedChannel = ch;' + text[ch_pos + len(ch_anchor):]

          collect_anchor = '    const collectedMsgs = collected.map(collectMessage);'
          collect_pos = text.find(collect_anchor, manual_start)
          if collect_pos < 0:
              raise SystemExit('manual collected messages anchor missing')
          collect_insert = collect_anchor + '''
            // Discord-Attachment-URLs laufen ab. Die Bytes muessen deshalb JETZT,
            // vor DB-Abschluss und Channel-Loeschung, dauerhaft ins HTML-Archiv.
            const attachmentArchive = await archiveTranscriptAttachments(collectedMsgs);'''
          text = text[:collect_pos] + collect_insert + text[collect_pos + len(collect_anchor):]

          audit_start = text.find("    logAudit('TICKET_CLOSED', 'TICKET', {", manual_start)
          if audit_start < 0:
              raise SystemExit('manual close audit missing')
          audit_line = '      transcriptTruncated,'
          audit_pos = text.find(audit_line, audit_start)
          if audit_pos < 0:
              raise SystemExit('manual audit transcript line missing')
          audit_insert = '''      transcriptTruncated,
              archivedAttachments: attachmentArchive.attachmentCount,
              archivedAttachmentBytes: attachmentArchive.archivedBytes,'''
          text = text[:audit_pos] + audit_insert + text[audit_pos + len(audit_line):]

          catch_start = text.find("  } catch (e) {\n    logger.error('Ticket-Close-Fehler'", manual_start)
          catch_end_marker = '\n}\n\n/**\n * Add-User-Button:'
          catch_end = text.find(catch_end_marker, catch_start)
          if catch_start < 0 or catch_end < 0:
              raise SystemExit('manual close catch markers missing')
          catch_replacement = '''  } catch (e) {
            const error = e as Error;
            logger.error('Ticket-Close-Fehler', error);
            logAudit('TICKET_CLOSE_FAILED', 'TICKET', {
              guildId: instance.guildId, instanceId: instance.id,
              closedBy: btn.user.id, error: error.message,
            });
            // Fail-closed: Bei einem Archivfehler den Ticket-Channel NICHT loeschen und
            // die zuvor gesetzten Schreibrechte fuer Opener/Staff wiederherstellen.
            if (lockedChannel) {
              await lockedChannel.permissionOverwrites.edit(instance.openerDiscordId, { SendMessages: true }).catch(() => {});
              if (instance.template.staffRoleId) {
                await lockedChannel.permissionOverwrites.edit(instance.template.staffRoleId, { SendMessages: true }).catch(() => {});
              }
            }
            const archiveFailed = error.message.startsWith('Ticket-Anh');
            await btn.editReply({
              content: archiveFailed
                ? 'Ticket wurde NICHT geschlossen: Mindestens ein Bild/Anhang konnte nicht vollstaendig archiviert werden. Der Ticket-Channel bleibt erhalten. Bitte erneut versuchen oder einen Admin informieren.'
                : 'Konnte Ticket nicht schliessen. Bitte Admin informieren.',
            }).catch(() => {});
          }'''
          text = text[:catch_start] + catch_replacement + text[catch_end:]

          path.write_text(text)
          PY

      - name: Verify focused patch shape
        shell: bash
        run: |
          test "$(grep -c 'archiveTranscriptAttachments(collectedMsgs)' src/modules/tickets/ticketSystem.ts)" -eq 2
          grep -q 'archivedDataUrl' src/modules/tickets/ticketSystem.ts
          grep -q 'class="att-link"' src/modules/tickets/ticketSystem.ts
          grep -q 'let lockedChannel: TextChannel | null = null' src/modules/tickets/ticketSystem.ts
          git diff --check

      - name: Commit source patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/tickets/ticketSystem.ts
          git commit -m "fix(tickets): preserve archived images in transcripts"
          git push origin HEAD:fix/ticket-transcript-archive-images

name: Lottery one-shot preflight cleanup

on:
  push:
    branches: [feat/economy-lottery]
    paths: [.github/workflows/finalize-lottery-preflight.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/economy-lottery
          fetch-depth: 0
      - run: python3 scripts/finalize_lottery_preflight.py
      - run: git diff --check
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/modules/economy/lottery.ts
          git rm -f -- scripts/finalize_lottery_preflight.py scripts/move_lottery_replay_before_status.py .github/workflows/fix-lottery-replay-order.yml .github/workflows/finalize-lottery-preflight.yml
          git commit -m "Normalize lottery purchase replay preflight"
          git push origin HEAD:feat/economy-lottery

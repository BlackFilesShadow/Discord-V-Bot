name: Dashboard-1W Final Hardening Patch

on:
  push:
    branches: [fix/dashboard-1w-audit-log-contract]
    paths: [.github/workflows/dashboard-1w-hardening-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/dashboard-1w-audit-log-contract
          fetch-depth: 0
      - name: Apply final hardening
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          logger_path = Path('src/utils/logger.ts')
          logger = logger_path.read_text()
          replacement = '''function redactSecrets(input: Record<string, unknown>): Record<string, unknown> {
            const out: Record<string, unknown> = {};
            for (const [k, v] of Object.entries(input)) {
              if (SECRET_KEY_RE.test(k)) {
                out[k] = '[REDACTED]';
              } else {
                // Reuse the same recursive/free-text policy as DB persistence and
                // dashboard reads. Arrays and nested strings cannot bypass the
                // append-only audit-file redaction path.
                out[k] = redactAuditDetails(v, k);
              }
            }
            return out;
          }
          '''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines()) + '\n'
          pattern = r"function redactSecrets\(input: Record<string, unknown>\): Record<string, unknown> \{.*?\n\}\n\n(?=export function logAudit)"
          logger2, count = re.subn(pattern, replacement + '\n', logger, count=1, flags=re.S)
          if count != 1:
            raise SystemExit(f'logger redactSecrets replacement count={count}')
          logger_path.write_text(logger2)

          server_path = Path('dashboard-ui/src/pages/Server.tsx')
          server = server_path.read_text()
          old_button = '<Button type="submit" disabled={list.isFetching && !list.isFetchingNextPage}>Suchen</Button>'
          new_button = '<Button type="submit" disabled={list.isFetching}>Suchen</Button>'
          if old_button in server:
            server = server.replace(old_button, new_button, 1)
          elif new_button not in server:
            raise SystemExit('Audit search button anchor not found')

          error_anchor = '''      {list.isError && (
            <Card>
              <p className="text-danger text-sm">Fehler: {(list.error as ApiError).message}</p>
            </Card>
          )}
'''
          extra_block = '''      {list.isFetchNextPageError && !list.isError && (
            <Card>
              <p className="text-danger text-sm">Fehler beim Nachladen: {(list.error as ApiError).message}</p>
            </Card>
          )}
'''
          if 'Fehler beim Nachladen:' not in server:
            if error_anchor not in server:
              raise SystemExit('Audit list error anchor not found')
            server = server.replace(error_anchor, error_anchor + extra_block, 1)
          server_path.write_text(server)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/logger.ts dashboard-ui/src/pages/Server.tsx
          if git diff --cached --quiet; then
            echo "No hardening changes required"
            exit 0
          fi
          git commit -m "Dashboard-1W: unify audit redaction and pagination errors"
          git push origin HEAD:fix/dashboard-1w-audit-log-contract

name: Lottery one-shot surface finalization

on:
  push:
    branches: [feat/economy-lottery]
    paths: [.github/workflows/finalize-lottery-surface.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/economy-lottery
          fetch-depth: 0
      - run: python3 scripts/finalize_lottery_surface.py
      - run: git diff --check
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/commands/dashboard/lottery.ts src/modules/economy/lottery.ts tests/security/economyLotteryIntegration.test.ts
          git rm -f --ignore-unmatch -- scripts/finalize_lottery_surface.py .github/workflows/finalize-lottery-surface.yml
          git commit -m "Finalize lottery Discord surface consistency"
          git push origin HEAD:feat/economy-lottery

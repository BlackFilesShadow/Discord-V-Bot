name: E2E (Playwright)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write

    defaults:
      run:
        working-directory: dashboard-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: pw-version
        run: |
          PW_VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Harden Ubuntu APT mirror for Playwright
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          for file in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$file" ]; then
              sudo sed -i \
                -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                "$file"
            fi
          done
          sudo tee /etc/apt/apt.conf.d/99-vbot-network >/dev/null <<'EOF'
          Acquire::Retries "5";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          EOF
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install Playwright system deps
        run: timeout --signal=TERM --kill-after=30s 5m npx playwright install-deps chromium

      - name: Install Playwright browser (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run E2E
        run: npm run e2e
        env:
          CI: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: dashboard-ui/playwright-report/
          retention-days: 7

      - name: Publish main Playwright gate status
        if: always() && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description="main Playwright gate failed"
          if [ "$JOB_STATUS" = "success" ]; then
            state=success
            description="main Playwright E2E passed"
          fi
          payload=$(printf '{"state":"%s","context":"vbot/main-playwright-gate","description":"%s","target_url":"%s"}' "$state" "$description" "$TARGET_URL")
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload"
          [ "$state" = "success" ]

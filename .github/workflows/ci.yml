name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  NODE_OPTIONS: '--max-old-space-size=4096'
  DOCKER_BUILDKIT: '1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            dashboard-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install dashboard-ui dependencies
        working-directory: dashboard-ui
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Lint (lint:all = Backend src+tests + Dashboard-UI)
        run: npm run lint:all
      - name: TypeScript Build
        run: npm run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: discord_v_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/discord_v_bot_test
      DISCORD_TOKEN: test-token
      DISCORD_CLIENT_ID: test-client-id
      DISCORD_CLIENT_SECRET: test-secret
      BOT_OWNER_ID: '123456789012345678'
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SESSION_SECRET: test-session-secret
      DASHBOARD_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            dashboard-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Run database migrations (production path)
        run: npx prisma migrate deploy
      - name: Verify migration status (no pending/drift)
        run: npx prisma migrate status
      - name: Run DB orphan/consistency scanner
        run: npm run db:consistency
      - name: Ensure PostgreSQL client for lifecycle verification
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1 || ! command -v pg_dump >/dev/null 2>&1 || ! command -v pg_restore >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y postgresql-client
          fi
          psql --version
          pg_dump --version
      - name: Verify fresh/upgrade/backup-restore database lifecycle
        run: npm run db:lifecycle
      - name: Stage 47 live PostgreSQL, Redis and worker-queue baseline
        run: npm run perf:data-plane-47
        env:
          REDIS_URL: redis://localhost:6379
          STAGE47_REQUIRE_LIVE: '1'
          STAGE47_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STAGE47_OUTPUT_PATH: stage47-artifacts/${{ github.event.pull_request.head.sha || github.sha }}.json
      - name: Upload Stage 47 data-plane evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: stage47-data-plane-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: stage47-artifacts/*.json
          if-no-files-found: warn
      - name: Stage 48 AI and Nitrado loopback performance baseline
        run: npm run perf:ai-nitrado-48
        env:
          STAGE48_REQUIRE_LAB: '1'
          STAGE48_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STAGE48_OUTPUT_PATH: stage48-artifacts/${{ github.event.pull_request.head.sha || github.sha }}.json
      - name: Upload Stage 48 AI and Nitrado evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: stage48-ai-nitrado-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: stage48-artifacts/*.json
          if-no-files-found: error
      - name: Stage 50 production dashboard and PostgreSQL load test
        run: npm run perf:load-50
        env:
          STAGE50_REQUIRE_LIVE: '1'
          STAGE50_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STAGE50_OUTPUT_PATH: stage50-artifacts/${{ github.event.pull_request.head.sha || github.sha }}.json
      - name: Upload Stage 50 full-stack load evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: stage50-full-stack-load-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: stage50-artifacts/*.json
          if-no-files-found: error
      - name: Run tests (no forceExit; leaked handles fail)
        id: jest
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 8m npm run test:ci 2>&1 | tee jest-ci.log
          status=${PIPESTATUS[0]}
          set -e

          leak=false
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::error::Jest hat das 8-Minuten-Limit ueberschritten (moeglicher offener Handle/Hang)."
            leak=true
          fi
          if grep -Eqi 'A worker process has failed to exit gracefully|Jest did not exit one second after the test run has completed' jest-ci.log; then
            echo "::error::Jest meldet nicht sauber geschlossene Worker/Handles."
            leak=true
          fi

          echo "leak=$leak" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ] || [ "$leak" = "true" ]; then
            exit 1
          fi
      - name: Upload primary Jest log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jest-primary-log
          path: jest-ci.log
          if-no-files-found: warn
      - name: Diagnose open handles
        if: failure() && steps.jest.outputs.leak == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 5m npm run test:handles 2>&1 | tee jest-open-handles.log
      - name: Upload open-handle diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jest-open-handles
          path: jest-open-handles.log
          if-no-files-found: ignore
      - name: Upload coverage
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-report
          path: coverage/

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history for secret scan
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true
      - name: Full-history secret scan (blocking)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            dashboard-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install dashboard-ui dependencies
        working-directory: dashboard-ui
        run: npm ci

      - name: Root npm audit (critical blocking)
        run: npm audit --audit-level=critical
      - name: Root npm audit (high blocking)
        run: npm audit --audit-level=high

      - name: Dashboard production audit (high blocking)
        working-directory: dashboard-ui
        run: npm audit --omit=dev --audit-level=high
      - name: Dashboard full audit (critical blocking)
        working-directory: dashboard-ui
        run: npm audit --audit-level=critical
      - name: Dashboard full audit (high blocking)
        working-directory: dashboard-ui
        run: npm audit --audit-level=high

      - name: Generate SBOMs (CycloneDX, blocking)
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @cyclonedx/cyclonedx-npm@latest \
            --output-format JSON \
            --output-file sbom.cyclonedx.json \
            --omit dev
          test -s sbom.cyclonedx.json
          (
            cd dashboard-ui
            npx --yes @cyclonedx/cyclonedx-npm@latest \
              --output-format JSON \
              --output-file sbom.cyclonedx.json \
              --omit dev
            test -s sbom.cyclonedx.json
          )
      - name: Upload SBOM artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sbom-cyclonedx
          path: |
            sbom.cyclonedx.json
            dashboard-ui/sbom.cyclonedx.json
          if-no-files-found: error

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint-and-build, test, security]
    # Stage 45: build + image CVE scan on PRs and main (main-gate still requires docker success on main).
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true
      - name: Build Docker Image
        run: |
          set -euo pipefail
          test -f Dockerfile
          docker build -t discord-v-bot:${{ github.sha }} .
      - name: Trivy image scan (CRITICAL blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: discord-v-bot:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL
          vuln-type: os,library
      - name: Trivy image scan (HIGH blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: discord-v-bot:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH
          vuln-type: os,library

  main-gate-status:
    name: Publish Main CI Gate Status
    runs-on: ubuntu-latest
    needs: [lint-and-build, test, security, docker]
    if: always() && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish commit status
        env:
          GH_TOKEN: ${{ github.token }}
          LINT_RESULT: ${{ needs.lint-and-build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description="main CI gate failed"
          if [ "$LINT_RESULT" = "success" ] \
            && [ "$TEST_RESULT" = "success" ] \
            && [ "$SECURITY_RESULT" = "success" ] \
            && [ "$DOCKER_RESULT" = "success" ]; then
            state=success
            description="main CI, DB, security and Docker passed"
          fi
          payload=$(printf '{"state":"%s","context":"vbot/main-ci-gate","description":"%s","target_url":"%s"}' "$state" "$description" "$TARGET_URL")
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload"
          [ "$state" = "success" ]

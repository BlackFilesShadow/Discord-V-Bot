name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  NODE_OPTIONS: '--max-old-space-size=4096'
  DOCKER_BUILDKIT: '1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            dashboard-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install dashboard-ui dependencies
        working-directory: dashboard-ui
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Lint (lint:all = Backend src+tests + Dashboard-UI)
        run: npm run lint:all
      - name: TypeScript Build
        run: npm run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: discord_v_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/discord_v_bot_test
      DISCORD_TOKEN: test-token
      DISCORD_CLIENT_ID: test-client-id
      DISCORD_CLIENT_SECRET: test-secret
      BOT_OWNER_ID: '123456789012345678'
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SESSION_SECRET: test-session-secret
      DASHBOARD_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            dashboard-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Run database migrations (production path)
        run: npx prisma migrate deploy
      - name: Verify migration status (no pending/drift)
        run: npx prisma migrate status
      - name: Run tests (no forceExit; leaked handles fail)
        id: jest
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 8m npm run test:ci 2>&1 | tee jest-ci.log
          status=${PIPESTATUS[0]}
          set -e

          leak=false
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::error::Jest hat das 8-Minuten-Limit ueberschritten (moeglicher offener Handle/Hang)."
            leak=true
          fi
          if grep -Eqi 'A worker process has failed to exit gracefully|Jest did not exit one second after the test run has completed' jest-ci.log; then
            echo "::error::Jest meldet nicht sauber geschlossene Worker/Handles."
            leak=true
          fi

          echo "leak=$leak" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ] || [ "$leak" = "true" ]; then
            exit 1
          fi
      - name: Upload primary Jest log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jest-primary-log
          path: jest-ci.log
          if-no-files-found: warn
      - name: Diagnose open handles
        if: failure() && steps.jest.outputs.leak == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 5m npm run test:handles 2>&1 | tee jest-open-handles.log
      - name: Upload open-handle diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jest-open-handles
          path: jest-open-handles.log
          if-no-files-found: ignore
      - name: Upload coverage
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-report
          path: coverage/

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            dashboard-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: npm audit (critical blocking)
        run: npm audit --audit-level=critical
      - name: npm audit (high - report only)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Generate SBOM (CycloneDX)
        run: |
          npx --yes @cyclonedx/cyclonedx-npm@latest \
            --output-format JSON \
            --output-file sbom.cyclonedx.json \
            --omit dev || echo "SBOM-Generation fehlgeschlagen (non-blocking)"
      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          if-no-files-found: warn

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint-and-build, test, security]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build Docker Image
        run: |
          if [ -f Dockerfile ]; then
            docker build -t discord-v-bot:${{ github.sha }} .
          else
            echo "Kein Dockerfile vorhanden, überspringe Docker Build"
          fi
